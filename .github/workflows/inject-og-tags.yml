name: Inject Open Graph meta tags

# Körs varje gång index.html ändras på main (t.ex. när bundler-verktyget
# publicerar om appen) och ser till att og-taggarna för länkdelning alltid
# finns kvar i den publicerade filen, oavsett vad publiceringsverktyget skriver.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
  workflow_dispatch:

jobs:
  inject-og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Se till att og-taggarna finns i index.html
        run: |
          python3 - <<'PYEOF'
          path = "index.html"
          with open(path, encoding="utf-8") as f:
              html = f.read()

          if "og:image" in html:
              print("OG-taggar finns redan, gör inget.")
          else:
              og_lines = [
                  '  <meta property="og:title" content="TEFA — Timos European Football Analyzer">',
                  '  <meta property="og:description" content="Statistik och analys for europeisk fotboll.">',
                  '  <meta property="og:type" content="website">',
                  '  <meta property="og:url" content="https://timsor68.github.io/TEFA/">',
                  '  <meta property="og:image" content="https://timsor68.github.io/TEFA/assets/og-image.jpg">',
                  '  <meta property="og:image:width" content="1200">',
                  '  <meta property="og:image:height" content="630">',
                  '  <meta name="twitter:card" content="summary_large_image">',
                  '  <meta name="twitter:title" content="TEFA — Timos European Football Analyzer">',
                  '  <meta name="twitter:description" content="Statistik och analys for europeisk fotboll.">',
                  '  <meta name="twitter:image" content="https://timsor68.github.io/TEFA/assets/og-image.jpg">',
              ]
              og_block = "\n".join(og_lines) + "\n"
              marker = "<title>TEFA — Timos European Football Analyzer</title>"
              if marker in html:
                  new_html = html.replace(marker, marker + "\n" + og_block, 1)
              else:
                  new_html = html.replace("<head>", "<head>\n" + og_block, 1)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(new_html)
              print("OG-taggar inlagda.")
          PYEOF

      - name: Committa ändringen (om något ändrades)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto: infoga Open Graph-taggar [skip ci]"
          git push
