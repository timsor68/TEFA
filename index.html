document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-raw-td style=\"padding:9px 5px 10px 16px\">\n                    <div style=\"display:flex;gap:4px\">\n                      <sc-for list=\"{{ t.formChips }}\" as=\"f\" hint-placeholder-count=\"1\">\n                        <div style=\"width:17px;height:17px;border-radius:5px;background:{{ f.bg }};color:#FFFFFF;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center\">{{ f.letter }}<\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px;padding:16px 18px;border-radius:14px;background:#FFFFFF;border:1px solid rgba(0,0,0,0.07);box-shadow:0 1px 4px rgba(4,20,18,0.07);width:min(94vw,1560px);margin-left:50%;transform:translateX(-50%)\">\n          <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.55);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Column key<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 20px\">\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">P<\u002Fstrong> — Played<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">W \u002F D \u002F L<\u002Fstrong> — Won \u002F Drawn \u002F Lost<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">GF \u002F GA<\u002Fstrong> — Goals For \u002F Against<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">GD<\u002Fstrong> — Goal Difference<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">Pts<\u002Fstrong> — Points<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">Home \u002F Away W-D-L<\u002Fstrong> — record split by venue<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#0D7A70\">O2.5%<\u002Fstrong> — share of the team's matches with 3+ total goals (Over 2.5)<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#0D7A70\">BTTS%<\u002Fstrong> — share where both teams scored<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">Avg G<\u002Fstrong> — average total goals per match<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">CS<\u002Fstrong> — Clean Sheets (kept a shutout)<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">FTS<\u002Fstrong> — Failed To Score<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#B45309\">YC\u002F90<\u002Fstrong> — yellow cards per match<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#DC2626\">RC<\u002Fstrong> — red cards (total)<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#B45309\">Crd\u002Fm<\u002Fstrong> — average total cards per match<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">Corn F\u002F90 · A\u002F90<\u002Fstrong> — average corners won \u002F conceded per match<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">Form<\u002Fstrong> — last 5 results (oldest → newest)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:rgba(20,23,28,0.45);margin-top:12px;line-height:1.6\">Click any column header to sort. Cards and corners come only from matches with synced detailed stats, so those columns fill in as you sync more matches.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStatsSegPlayers }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-if value=\"{{ playersNotAvailable }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:50px 20px;text-align:center\">\n            <div style=\"font-size:14px;font-weight:700;color:#14171C\">Player statistics: Premier League 2026\u002F27 only<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.5);margin-top:8px;line-height:1.6;max-width:460px;margin-left:auto;margin-right:auto\">The free player-data source (official Fantasy Premier League API) covers only the current PL season. No free source found for Championship or historical player data.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ playersAvailable }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px\">\n          <sc-for list=\"{{ playerBoards }}\" as=\"board\" hint-placeholder-count=\"3\">\n            <div style=\"background:#FFFFFF;border-radius:14px;border:1px solid rgba(0,0,0,0.07);padding:18px\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n                <div style=\"font-size:14.5px;font-weight:800;color:#14171C\">{{ board.title }}<\u002Fdiv>\n                <div style=\"font-size:11px;font-weight:700;color:rgba(20,23,28,0.45);text-transform:uppercase\">{{ board.unit }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ board.hasRows }}\" hint-placeholder-val=\"{{ false }}\">\n                <sc-for list=\"{{ board.rows }}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,0.05)\">\n                    <div style=\"width:20px;font-size:12px;font-weight:700;color:rgba(20,23,28,0.4);text-align:right\">{{ p.rank }}<\u002Fdiv>\n                    <sc-if value=\"{{ p.teamHasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ p.teamLogo }}\" style=\"width:22px;height:22px;flex-shrink:0;object-fit:contain\" \u002F><\u002Fsc-if><sc-if value=\"{{ p.teamNoLogo }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:22px;height:22px;border-radius:50%;flex-shrink:0;background:{{ p.teamColor }};color:{{ p.teamText }};display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:800\">{{ p.teamCode }}<\u002Fdiv><\u002Fsc-if>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:13.5px;font-weight:600;color:#14171C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ p.name }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:rgba(20,23,28,0.45)\">{{ p.sub }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:15px;font-weight:800;color:#14171C\">{{ p.value }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ board.noRows }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size:12.5px;color:rgba(20,23,28,0.45);margin-top:14px;line-height:1.6\">No data yet — sync in the panel above once the season is underway.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ playersFromSync }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:12px;l ize:8px;font-weight:800\">{{ team.code }}<\u002Fdiv><\u002Fsc-if>\n              <div style=\"font-size:13px;font-weight:600;color:#14171C;white-space:nowrap\">{{ team.name }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showFavList }}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-for list=\"{{ favGroups }}\" as=\"grp\" hint-placeholder-count=\"3\">\n          <div style=\"font-size:12.5px;font-weight:700;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin:22px 0 10px\">{{ grp.label }}<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:{{ matchCardGap }}\">\n            <sc-for list=\"{{ grp.matches }}\" as=\"m\" hint-placeholder-count=\"2\">\n              <div data-match-card=\"1\" sc-camel-on-click=\"{{ m.open }}\" style=\"padding:{{ matchCardPad }};border-radius:14px;background:{{ m.rowBg2 }};border:1px solid rgba(0,0,0,0.08);cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,0.7) inset,0 3px 7px rgba(4,20,18,0.08)\">\n                <div style=\"display:flex;align-items:center;gap:12px\">\n                  <div style=\"flex:1;min-width:0;display:flex;align-items:center;gap:9px\">\n                    <sc-if value=\"{{ m.homeHasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ m.homeLogo }}\" style=\"width:30px;height:30px;flex-shrink:0;object-fit:contain\" \u002F><\u002Fsc-if><sc-if value=\"{{ m.homeNoLogo }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:30px;height:30px;border-radius:50%;flex-shrink:0;background:{{ m.homeColor }};color:{{ m.homeText }};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800\">{{ m.homeCode }}<\u002Fdiv><\u002Fsc-if>\n                    <div style=\"font-size:14px;color:#14171C;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ m.homeName }}<\u002Fdiv>\n flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px\">\n          <div>\n            <div style=\"font-size:22px;font-weight:800;color:#14171C\">FPL<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:rgba(20,23,28,0.5);margin-top:6px\">Fantasy Premier League player stats — price, ownership, form, points and more, straight from the official FPL API. Premier League 2026\u002F27 only. {{ fplSourceFetchedLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ fplNotAvailable }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:50px 20px;text-align:center\">\n            <div style=\"font-size:14px;font-weight:700;color:#14171C\">FPL data: Premier League 2026\u002F27 only<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.5);margin-top:8px;line-height:1.6;max-width:460px;margin-left:auto;margin-right:auto\">This tab always shows the current PL season — switch the league\u002Fseason selector back to Premier League 2026\u002F27 to see it. To see a player's <em>previous<\u002Fem> seasons, go there and click their row in the table; the season switcher doesn't apply to FPL data.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ fplNotSynced }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:50px 20px;text-align:center\">\n            <div style=\"font-size:14px;font-weight:700;color:#14171C\">No FPL data yet<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.5);margin-top:8px;line-height:1.6;max-width:460px;margin-left:auto;margin-right:auto\">Open the Stats tab and press Sync. If this is the first time, make sure the fpl-sync GitHub Action has run at least once (Actions tab → fpl-sync → Run workflow) so the data file exists.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ fplSynced }}\" hint-placeholder-val=\"{{ false }}\">\n .7)\">{{ s.endPrice }}<\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ fplHasRows }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"overflow:auto;max-height:calc(100vh - 230px);background:#FFFFFF;border-radius:14px;border:1px solid rgba(0,0,0,0.07);box-shadow:0 1px 4px rgba(4,20,18,0.07);padding:4px 12px;width:min(94vw,1560px);margin-left:50%;transform:translateX(-50%)\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:{{ fplTableMinWidth }}\">\n              <sc-raw-thead>\n                <sc-raw-tr style=\"border-bottom:1px solid rgba(0,0,0,0.12)\">\n                  <sc-for list=\"{{ fplHeaders }}\" as=\"h\" hint-placeholder-count=\"10\">\n                    <sc-raw-th sc-camel-on-click=\"{{ h.click }}\" style=\"position:sticky;top:0;z-index:1;background:#FFFFFF;text-align:{{ h.align }};padding:11px 5px;font-size:11px;font-weight:700;color:{{ h.color }};text-transform:uppercase;cursor:pointer;white-space:nowrap;user-select:none;border-bottom:1px dotted rgba(20,23,28,0.35)\">{{ h.label }}{{ h.arrow }}<\u002Fsc-raw-th>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ fplRows }}\" as=\"p\" hint-placeholder-count=\"10\">\n                  <sc-raw-tr data-stat-row=\"1\" sc-camel-on-click=\"{{ p.toggleHistory }}\" style=\"border-bottom:1px solid rgba(0,0,0,0.06);background:{{ p.rowBg }};cursor:pointer\">\n                    <sc-raw-td style=\"padding:9px 5px\">\n                      <div style=\"display:flex;align-items:center;gap:8px\">\n                        <sc-if value=\"{{ p.teamHasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ ont-size:13px;color:rgba(20,23,28,0.7)\">{{ p.ppg }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.goals }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.assists }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.cleanSheets }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.bonus }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.bps }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.ict }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.xg }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.xa }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.xgi }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.minutes }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:#B45309;font-weight:600\">{{ p.yc }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:#DC2626;font-weight:600\">{{ p.rc }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:9px 5px 10px 10px;max-width:170px\">\n                      <div style=\"font-size:11.5px;font-weight:700;color:{{ p.statusColor }}\">{{ p.statusLabel }}<\u002Fdiv>\n                      <div style=\"font-size:10px;color:rgba(20,23,28,0.45);line-height:1.3\">{{ p.news }}<\u002Fdiv>\n                    <\u002Fsc-raw-td><\u002Fsc-if>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:rgba(255,255,255,0.8);margin-top:14px;line-height:1.6\">Click any column header to sort, click a player row to see previous seasons. GW Δ = price change this gameweek. ICT = Influence\u002FCreativity\u002FThreat index. xG\u002FxA\u002FxGI = expected goals \u002F assists \u002F goal involvements.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ fplNoRows }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:40px 20px;text-align:center;font-size:13px;color:rgba(20,23,28,0.5);background:#FFFFFF;border-radius:14px;border:1px solid rgba(0,0,0,0.07);box-shadow:0 1px 4px rgba(4,20,18,0.07);width:min(94vw,1560px);margin-left:50%;transform:translateX(-50%)\">No players match this filter.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n    \n<\u002Fdiv>\n<\u002Fsc-if>\n\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showDetail }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeMatch }}\" style=\"position:fixed;inset:0;background:rgba(15,23,42,0.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px\">\n      <div sc-camel-on-click=\"{{ stopClick }}\" style=\"width:560px;max-width:100%;max-height:86vh;overflow-y:auto;background:#FFFFFF;border-radius:20px;border:1px solid rgba(0,0,0,0.08);padding:28px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.15)\">\n        <div sc-camel-on-click=\"{{ closeMatch }}\" style=\"position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:15px;background:rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center;font-size:18px;color:#14171C;cursor:pointer\">×<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:700;color:rgba(20,23,28,0.55);text-align:center\">{{ selectedMatch.roundLabel }}<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:26px;margin-top:20px\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;width:130px\">\n            <sc-if value=\"{{ selectedMatch.homeHasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ selectedMatch.homeLogo }}\" style=\"width:64px;height:64px;flex-shrink:0;object-fit:contain\" \u002F><\u002Fsc-if><sc-if value=\"{{ selectedMatch.homeNoLogo }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:64px;height:64px;border-radius:50%;background:{{ selectedMatch.homeColor }};color:{{ selectedMatch.homeText }};display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800\">{{ selectedMatch.homeCode }}<\u002Fdiv><\u002Fsc-if>\n            <div style=\"font-size:13.5px;font-weight:700;color:#14171C;text-align:center\">{{ selectedMatch.homeName }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasScore }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:28px;font-weight:800;color:#14171C;white-space:nowrap\">{{ scoreLabel }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noScore }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:14px;font-weight:700;color:rgba(20,23,28,0.35)\">vs<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;width:130px\">\n            <sc-if value=\"{{ selectedMatch.awayHasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ selectedMatch.awayLogo }}\" style=\"width:64px;height:64px;flex-shrink:0;object-fit:contain\" \u002F><\u002Fsc-if><sc-if value=\"{{ selectedMatch.awayNoLogo }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:64px;height:64px;border-radius:50%;background:{{ selectedMatch.awayColor }};color:{{ selectedMatch.awayText }};display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800\">{{ selectedMatch.awayCode }}<\u002Fdiv><\u002Fsc-if>\n            <div style=\"font-size:13.5px;font-weight:700;color:#14171C;text-align:center\">{{ selectedMatch.awayName }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;margin-top:20px\">\n          <div style=\"display:inline-block;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,0.05);font-size:12.5px;font-weight:800;color:{{ selectedMatch.statusColor }}\">{{ selectedMatch.statusPill }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;margin-top:14px\">\n          <div style=\"font-size:15px;font-weight:700;color:#14171C\">{{ selectedMatch.dateFull }}<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:rgba(20,23,28,0.55);margin-top:4px\">Kickoff {{ selectedMatch.timeLabel }} · {{ selectedMatch.venue }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ tableSynced }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">League table position<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\">\n              <div style=\"flex:1;background:rgba(37,99,235,0.06);border:1px solid rgba(37,99,235,0.18);border-radius:12px;padding:12px 14px\">\n                <div style=\"font-size:12px;font-weight:700;color:#14171C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ selectedMatch.homeName }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:6px\">\n                  <div style=\"font-size:22px;font-weight:800;color:#0D7A70\">{{ homeStand.rank }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:rgba(20,23,28,0.6)\">{{ homeStand.pts }} pts · {{ homeStand.played }} pl<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11.5px;color:rgba(20,23,28,0.55);margin-top:3px\">{{ homeStand.record }} · GD {{ homeStand.gd }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#0D7A70;font-weight:700;margin-top:3px\">{{ homeStand.venue }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;background:rgba(180,83,9,0.06);border:1px solid rgba(180,83,9,0.18);border-radius:12px;padding:12px 14px\">\n                <div style=\"font-size:12px;font-weight:700;color:#14171C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ selectedMatch.awayName }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:6px\">\n                  <div style=\"font-size:22px;font-weight:800;color:#92400E\">{{ awayStand.rank }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:rgba(20,23,28,0.6)\">{{ awayStand.pts }} pts · {{ awayStand.played }} pl<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11.5px;color:rgba(20,23,28,0.55);margin-top:3px\">{{ awayStand.record }} · GD {{ awayStand.gd }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#92400E;font-weight:700;margin-top:3px\">{{ awayStand.venue }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ analysisReady }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px;padding:16px;border-radius:14px;background:linear-gradient(180deg,rgba(37,99,235,0.05),rgba(0,0,0,0.02));border:1px solid rgba(0,0,0,0.08)\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px\">\n              <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em\">Win-lean analysis<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:800;color:#14171C\">{{ leanLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;height:26px;border-radius:8px;overflow:hidden;margin-top:12px;font-size:11px;font-weight:800\">\n              <div style=\"width:{{ homePStr }};background:{{ homePBarColor }};color:#FFFFFF;display:flex;align-items:center;justify-content:center;min-width:34px\">{{ homePStr }}<\u002Fdiv>\n              <div style=\"width:{{ drawPStr }};background:rgba(120,120,120,0.55);color:#FFFFFF;display:flex;align-items:center;justify-content:center;min-width:30px\">{{ drawPStr }}<\u002Fdiv>\n              <div style=\"width:{{ awayPStr }};background:{{ awayPBarColor }};color:#FFFFFF;display:flex;align-items:center;justify-content:center;min-width:34px\">{{ awayPStr }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:10.5px;color:rgba(20,23,28,0.5);margin-top:5px\">\n              <div>{{ selectedMatch.homeName }} win<\u002Fdiv><div>Draw<\u002Fdiv><div>{{ selectedMatch.awayName }} win<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasAnalysisFactors }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:14px\">\n                <div style=\"font-size:11px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;margin-bottom:8px\">Why<\u002Fdiv>\n                <sc-for list=\"{{ analysisFactors }}\" as=\"fa\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.05)\">\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:12.5px;font-weight:600;color:#14171C\">{{ fa.label }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:rgba(20,23,28,0.5)\">{{ fa.detail }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;background:{{ fa.chipBg }};color:{{ fa.chipColor }}\">{{ fa.who }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:12px;line-height:1.6\">A naive, transparent heuristic from form, table, goal difference and H2H — <strong>not<\u002Fstrong> a calibrated probability, not bookmaker odds, and not betting advice. It cannot see injuries, line-ups, motivation or market movement, which often decide matches. Use it as one input, not a signal.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ gm.ready }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px;padding:16px;border-radius:14px;background:rgba(37,99,235,0.04);border:1px solid rgba(0,0,0,0.08)\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Goals markets (from venue form)<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\">\n              <div style=\"flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.7);text-align:center\">\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.5);text-transform:uppercase;font-weight:700\">Over 2.5<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:800;color:#0D7A70;margin-top:2px\">{{ gm.leanO25 }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.6);margin-top:2px\">{{ gm.o25Verdict }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:4px\">{{ selectedMatch.homeCode }} home {{ gm.homeO25 }} · {{ selectedMatch.awayCode }} away {{ gm.awayO25 }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.7);text-align:center\">\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.5);text-transform:uppercase;font-weight:700\">BTTS<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:800;color:#0D7A70;margin-top:2px\">{{ gm.leanBtts }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.6);margin-top:2px\">{{ gm.bttsVerdict }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:4px\">{{ selectedMatch.homeCode }} home {{ gm.homeBtts }} · {{ selectedMatch.awayCode }} away {{ gm.awayBtts }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.7);text-align:center\">\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.5);text-transform:uppercase;font-weight:700\">Avg goals<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:800;color:#14171C;margin-top:2px\">{{ gm.avgG }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.6);margin-top:2px\">expected total<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:10px;line-height:1.6\">Home side's home matches and away side's away matches only — descriptive tendencies, not a probability or betting advice.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ gm.ccReady }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;padding:16px;border-radius:14px;background:rgba(180,83,9,0.04);border:1px solid rgba(0,0,0,0.08)\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Corners &amp; cards markets<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\">\n              <div style=\"flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.7);text-align:center\">\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.5);text-transform:uppercase;font-weight:700\">Corners<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:800;color:#0D7A70;margin-top:2px\">{{ gm.expCorners }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.6);margin-top:2px\">expected · O9.5 {{ gm.corLean }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.55);margin-top:2px\">{{ gm.corVerdict }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.7);text-align:center\">\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.5);text-transform:uppercase;font-weight:700\">Cards<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:800;color:#B45309;margin-top:2px\">{{ gm.expCards }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.6);margin-top:2px\">expected · O4.5 {{ gm.crdLean }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.55);margin-top:2px\">{{ gm.crdVerdict }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:10px;line-height:1.6\">Based only on matches with synced detailed stats, so the sample can be small — sync more matches for firmer numbers. Descriptive, not betting advice.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasStatRows }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Match statistics<\u002Fdiv>\n            <sc-for list=\"{{ statRows }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"margin-bottom:10px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:#14171C\">\n                  <div style=\"width:40px\">{{ s.home }}<\u002Fdiv>\n                  <div style=\"color:rgba(20,23,28,0.5);font-weight:600\">{{ s.label }}<\u002Fdiv>\n                  <div style=\"width:40px;text-align:right\">{{ s.away }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:4px;margin-top:4px\">\n                  <div style=\"flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,0.06);position:relative;overflow:hidden;display:flex;justify-content:flex-end\"><div style=\"width:{{ s.homePct }}%;height:5px;border-radius:3px;background:{{ selectedMatch.homeColor }}\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,0.06);position:relative;overflow:hidden\"><div style=\"width:{{ s.awayPct }}%;height:5px;border-radius:3px;background:{{ selectedMatch.awayColor }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ statsPending }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px;font-size:12.5px;color:rgba(20,23,28,0.45)\">Loading match statistics…<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ statsFailed }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px;font-size:12.5px;color:#B91C1C;line-height:1.5\">Could not load match statistics: {{ sumError }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasGoals }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Goals &amp; assists<\u002Fdiv>\n            <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n              <sc-if value=\"{{ goalsInfo.homeHasScorers }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex:1;min-width:200px\">\n                  <div style=\"font-size:11.5px;font-weight:800;color:#14171C;margin-bottom:6px\">{{ selectedMatch.homeName }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#14171C;line-height:1.6\">{{ goalsInfo.homeScorers }}<\u002Fdiv>\n                  <sc-if value=\"{{ goalsInfo.homeHasAssists }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:11.5px;color:rgba(20,23,28,0.55);margin-top:3px\">Assist: {{ goalsInfo.homeAssists }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ goalsInfo.awayHasScorers }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex:1;min-width:200px\">\n                  <div style=\"font-size:11.5px;font-weight:800;color:#14171C;margin-bottom:6px\">{{ selectedMatch.awayName }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#14171C;line-height:1.6\">{{ goalsInfo.awayScorers }}<\u002Fdiv>\n                  <sc-if value=\"{{ goalsInfo.awayHasAssists }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:11.5px;color:rgba(20,23,28,0.55);margin-top:3px\">Assist: {{ goalsInfo.awayAssists }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:10px;line-height:1.6\">Totals for the whole match from the synced stats feed — exact goal minute is not available from this data source yet.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasForm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Form — last 5 (oldest first)<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n              <div style=\"width:36px;font-size:11px;font-weight:800;color:rgba(20,23,28,0.55)\">{{ selectedMatch.homeCode }}<\u002Fdiv>\n              <div style=\"display:flex;gap:5px\">\n                <sc-for list=\"{{ homeFormChips }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div style=\"width:22px;height:22px;border-radius:6px;background:{{ f.bg }};color:#FFFFFF;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center\">{{ f.letter }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <div style=\"width:36px;font-size:11px;font-weight:800;color:rgba(20,23,28,0.55)\">{{ selectedMatch.awayCode }}<\u002Fdiv>\n              <div style=\"display:flex;gap:5px\">\n                <sc-for list=\"{{ awayFormChips }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div style=\"width:22px;height:22px;border-radius:6px;background:{{ f.bg }};color:#FFFFFF;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center\">{{ f.letter }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:24px\">\n          <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Head to head<\u002Fdiv>\n          <div style=\"font-size:11px;color:rgba(20,23,28,0.4);margin-bottom:10px\">{{ h2hNote }}Season meetings show \"MW n\" until played.<\u002Fdiv>\n          <sc-if value=\"{{ h2hNoKey }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.45);line-height:1.6\">Run a sync in the Stats tab first — data will appear here afterwards.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ h2hEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.45)\">No previous meetings found in the API.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ h2hHasRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-for list=\"{{ h2hRows }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.05)\">\n                <div style=\"width:96px;flex-shrink:0;font-size:11.5px;color:rgba(20,23,28,0.5)\">{{ h.dateLabel }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0;font-size:12.5px;font-weight:600;color:#14171C;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ h.homeName }}<\u002Fdiv>\n                <div style=\"width:44px;flex-shrink:0;text-align:center;font-size:13px;font-weight:800;color:#14171C\">{{ h.score }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0;font-size:12.5px;font-weight:600;color:#14171C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ h.awayName }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:24px\">\n          <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Unavailable \u002F doubtful players<\u002Fdiv>\n          <div style=\"font-size:11px;color:rgba(20,23,28,0.4);margin-bottom:10px\">Current squad status via the official Fantasy Premier League feed — reflects status now, not at the time of past matches.<\u002Fdiv>\n          <sc-if value=\"{{ injNoKey }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.45);line-height:1.6\">Run a sync in the Stats tab first — data will appear here afterwards.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ injNotAvailable }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.45);line-height:1.6\">Availability data exists only for Premier League 2026\u002F27 (via the FPL feed) — not for this league\u002Fseason.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ injNone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.45)\">No flagged absences for either squad in the FPL feed right now.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ injDone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n              <sc-if value=\"{{ injHomeHas }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex:1;min-width:200px\">\n                  <div style=\"font-size:11.5px;font-weight:800;color:#14171C;margin-bottom:6px\">{{ selectedMatch.homeName }}<\u002Fdiv>\n                  <sc-for list=\"{{ injHome }}\" as=\"p\" hint-placeholder-count=\"2\">\n                    <div style=\"padding:5px 0;border-bottom:1px solid rgba(0,0,0,0.05)\">\n                      <div style=\"font-size:12.5px;font-weight:600;color:#14171C\">{{ p.name }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:rgba(20,23,28,0.5)\">{{ p.reason }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ injAwayHas }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex:1;min-width:200px\">\n                  <div style=\"font-size:11.5px;font-weight:800;color:#14171C;margin-bottom:6px\">{{ selectedMatch.awayName }}<\u002Fdiv>\n                  <sc-for list=\"{{ injAway }}\" as=\"p\" hint-placeholder-count=\"2\">\n                    <div style=\"padding:5px 0;border-bottom:1px solid rgba(0,0,0,0.05)\">\n                      <div style=\"font-size:12.5px;font-weight:600;color:#14171C\">{{ p.name }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:rgba(20,23,28,0.5)\">{{ p.reason }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"text-align:center;padding:28px 24px 36px;margin-top:12px\">\n    <img src=\"data:image\u002Fpng;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAACLz2ctAACSb0lEQVR42uz9ZZhdZdY1Co976fa9S3a5VyquEHdXSAgRPLg03nTjkgR3aSCNu8aAkASSQFIVd694qlLu223p\u002Ff1Yaxc8z7ne75z3HOimn5d1URcV21W19lzznnPMMcYE\u002Frz+vP68\u002Frz+vP68\u002Frz+vP68\u002Frz+vP68\u002Frz+vP68\u002Frz+vP68\u002Frz+vP68\u002Frz+vP68\u002Frz+vP68\u002Frz+vP68\u002Frx+fZE\u002Fb8GfN\u002FB3uS8LFy4kixYtQnl5OZP8zbFjx9Jly5Zh3rx5OgAwDEMBQNd1Yt5LUl5eTgCgvLwcvXr1osuWLUPPnj3pokWLKCGE\u002Fnlr\u002FwzA\u002F8u1cOFCplevXsTr9ZKxY8dSQoj2v3H\u002F\u002Fh8HFcMw+Oqrr1iv10va2tro\u002FPnz9f+df\u002F9nAP7PDDjtv2cmSimZNWtW9s03X5fT3NzRPc2T5k4ocneOYzJyc3PEU6fO5GVnZ8fi8VgKx3FaMBhSAURcLmdDR0dHOByOBvz+jjqn09NYX1\u002FTOmTIkMDWrVsbXnvttcB\u002F\u002F14opUx5eTmzZMkSumzZsv\u002FjAvL\u002FmACklJJly5Yx8+bNw3\u002FPcC+\u002F\u002FExJe3u4V\u002F8BAybrmlZU0qVLYXNjU7Hb43Hk5GTDYXfA6XTAarWCYZhfvyYIIdA1DbFYHBQUsiwjHI4gGo0iHA4jEPBD0zQaDIXaO9ra69LT0+oam1oOBIPh3Tt2bNn+008\u002FBTvfDEKg6zq7bNky\u002FJ+SHf\u002FHB+DSpUtZAJg\u002Ff35n0A0ePDhv3LiJg0pLS0ZRSocVFub3T\u002FGkWHLzcpGRkQGe5ztjDIBm\u002Fp\u002FEEwlIiQRisRjRdR3Gh0YYlqUsy4LjeOp0OijPC4TnuOT9JZqmMbquI5FIwNfhg8\u002FvR2NjIxoa6pskWT6h69h2rPL4hnfeWbIXQCz sync, { phase }) })); }\n\n  \u002F\u002F ---- TheSportsDB sync (Finland \u002F Iceland only) ----------------------------------\n  async tsdbResolveLeagueId(league, country) {\n    \u002F\u002F Prefer a known hardcoded id (TheSportsDB's search endpoint is restricted on the free key).\n    if (TSDB_LEAGUE_ID[league]) {\n      const id = TSDB_LEAGUE_ID[league];\n      const names = Object.assign({}, this.state.store.tsdbLeagueNames || {});\n      if (!names[league]) { names[league] = leagueCfg(league).label; this.saveStoreTop({ tsdbLeagueNames: names }); }\n      return id;\n    }\n    const cached = (this.state.store.tsdbLeagueIds || {})[league];\n    if (cached) return cached;\n    const d = await this.fetchJsonCors(TSDB_BASE + '\u002Fsearch_all_leagues.php?c=' + encodeURIComponent(country) + '&s=Soccer');\n    const list = d.countrys || d.leagues || [];\n    if (!list.length) throw new Error('TheSportsDB lists no soccer leagues for ' + country);\n    const hints = TSDB_LEAGUE_HINT[league] || [];\n    const bad = ['women', 'kvenna', 'u19', 'u21', 'u23', 'youth', 'cup', 'bikar', 'reserve'];\n    const clean = list.filter((l) => { const n = String(l.strLeague || '').toLowerCase(); return !bad.some((x) => n.indexOf(x) !== -1); });\n    const pool = clean.length ? clean : list;\n    let pick = pool.find((l) => { const n = String(l.strLeague || '').toLowerCase(); return hints.some((h) => n.indexOf(h) !== -1); });\n    if (!pick) pick = pool[0];\n    const id = pick.idLeague;\n    const map = Object.assign({}, this.state.store.tsdbLeagueIds || {}); map[league] = id;\n    const names = Object.assign({}, this.state.store.tsdbLeagueNames || {}); names[league] = pick.strLeague || '';\n    this.saveStoreTop({ tsdbLeagueIds: map, tsdbLeagueNames: names });\n    return id;\n  }\n\n  async tsdbSyncLeague(league, seasonKey, scfg, bid) {\n    const lc = leagueCfg(league);\n    const tsdbId = await this.tsdbResolveLeagueId(league, lc.country);\n    const resolvedName = (this.state.store.tsdbLeagueNames || {})[league] || ('league #' + tsdbId);\n    let teams = {}; let fixtures = {}; const sources = {};\n\n    \u002F\u002F Recent results + upcoming fixtures FIRST — these endpoints are season-independent and\n    \u002F\u002F always return current data, so they're the reliable \"basic data\" backbone.\n    const ingest = (ev) => {\n      if (!ev) return;\n      const hc = this.registerTeam(teams, ev.strHomeTeam, null, null, ev.strHomeTeamBadge || null);\n      const ac = this.registerTeam(teams, ev.strAwayTeam, null, null, ev.strAwayTeamBadge || null);\n      const hs = ev.intHomeScore, as_ = ev.intAwayScore;\n      const done = hs != null && hs !== '' && as_ != null && as_ !== '';\n      const dt = ev.strTimestamp || (ev.dateEvent ? ev.dateEvent + 'T' + (ev.strTime || '00:00:00') : null);\n      if (!dt) return;\n      const uid = hc + '|' + ac + '|' + String(dt).slice(0, 10);\n      fixtures[uid] = {\n        uid, round: ev.intRound ? num(ev.intRound) : null, date: dt, venue: ev.strVenue || null,\n        home: hc, away: ac, state: done ? 'post' : 'pre',\n        gh: done ? num(hs) : null, ga: done ? num(as_) : null, espnId: null, src: 'tsdb',\n      };\n    };\n    \u002F\u002F The free-tier \"eventspastleague\"\u002F\"eventsnextleague\" endpoints cap out hard \\u2014 for a\n    \u002F\u002F smaller league like this they can return as little as a single event, nowhere near\n    \u002F\u002F enough to see the full team list or compute form (which needs real match history).\n    \u002F\u002F \"eventsround.php\" has no such cap per call, so page through every round of the season\n    \u002F\u002F instead. Slower (one request per round) but it's the only reliable way to get complete\n    \u002F\u002F coverage from this API tier, and it naturally picks up upcoming (unplayed) rounds too.\n    const curYear = new Date().getFullYear();\n    const roundSeason = scfg.espnSeason || curYear;\n    let total = 0, missesInARow = 0, round = 1;\n    while (round <= 40 && missesInARow < 3) {\n      try {\n        const r = await this.fetchJsonCors(TSDB_BASE + '\u002Feventsround.php?id=' + tsdbId + '&r=' + round + '&s=' + roundSeason);\n        const evs = r.events || [];\n        if (evs.length) { evs.forEach((e) => { ingest(e); total++; }); missesInARow = 0; }\n        else { missesInARow++; }\n      } catch (e) { missesInARow++; }\n      round++;\n      await delay(120);\n    }\n    sources.tsdbEvents = total ? { ok: true, ts: Date.now(), count: total } : { ok: false, ts: Date.now(), err: 'no events found via round-by-round fetch (free key may not cover this league\u002Fseason)' };\n\n    \u002F\u002F Standings: try the selected season, then the current year, then no season param.\n    \u002F\u002F Note: some leagues (e.g. Veikkausliiga) split into a championship\u002Fchallenger group\n    \u002F\u002F partway through the season, and this endpoint only ever returns ONE of those groups\n    \u002F\u002F (6 of 12 teams) \\u2014 never the full table. So this is only ever treated as a starting\n    \u002F\u002F point; below we compare it against the standings computed from the full round-by-round\n    \u002F\u002F fixture set above, and use whichever actually has more teams in it.\n    let standings = null;\n    const buildTable = (table) => table.map((r) => {\n      const code = this.registerTeam(teams, r.strTeam, null, null, r.strBadge || null);\n      return {\n        code, rank: num(r.intRank), pts: num(r.intPoints), gd: num(r.intGoalDifference),\n        played: num(r.intPlayed), win: num(r.intWin), draw: num(r.intDraw), lose: num(r.intLoss),\n        gf: num(r.intGoalsFor), ga: num(r.intGoalsAgainst),\n      };\n    });\n    const seasonTries = [scfg.espnSeason, curYear, curYear + '-' + curYear, (curYear - 1) + '-' + curYear].filter((v, i, a) => a.indexOf(v) === i);\n    let tableErr = '';\n    for (const s of seasonTries) {\n      try {\n        const st = await this.fetchJsonCors(TSDB_BASE + '\u002Flookuptable.php \n      this.setPhase(phasePrefix + 'TheSportsDB: fetching ' + leagueCfg(league).label + ' ' + scfg.label + '…');\n      try { await this.tsdbSyncLeague(league, seasonKey, scfg, bid); return []; }\n      catch (e) { return [String(e.message || e)]; }\n    }\n\n    const problems = [];\n    let b = Object.assign(emptyBucket(), this.bucket(league, seasonKey));\n    let fixtures = Object.assign({}, b.fixtures);\n    let teams = Object.assign({}, b.teams);\n    const sources = Object.assign({}, b.sources);\n\n    \u002F\u002F 1) ESPN scoreboard for the whole season\n    let usedPrevSeason = false;\n    try {\n      this.setPhase(phasePrefix + 'ESPN: results & scores (' + scfg.label + ')…');\n      let d = await this.fetchJson(espnScoreUrl(league) + '?limit=600&dates=' + scfg.dates);\n      let events = d.events || [];\n      if (!events.length) {\n        \u002F\u002F Fallback A: some leagues (smaller ones especially) haven't had next season's\n        \u002F\u002F fixtures published by ESPN yet. Try the previous season's full date range first —\n        \u002F\u002F it's complete, so it gives the full team roster instead of a handful of teams.\n        try {\n          const prevDates = scfg.dates.replace(\u002F(\\d{4})(\\d{4})\u002Fg, (m, y, md) => (Number(y) - 1) + md);\n          d = await this.fetchJson(espnScoreUrl(league) + '?limit=600&dates=' + prevDates);\n          events = d.events || [];\n          if (events.length) usedPrevSeason = true;\n        } catch (e1) {}\n      }\n      if (!events.length) {\n        \u002F\u002F Fallback B: retry with the season param, then with no date filter (ESPN's current\n        \u002F\u002F default slate) as a last resort — these often return only a handful of matches.\n        try {\n          d = await this.fetchJson(espnScoreUrl(league) + '?limit=600&season=' + scfg.espnSeason);\n          events = d.events || [];\n        } catch (e2) {}\n        if (!events.length) {\n          try { d = await this.fetchJson(espnScoreUrl(league) + '?limit=600'); events = d.events || []; } catch (e3) {}\n        }\n      }\n      if (!events.length) throw new Error('ESPN returned no matches for ' + league + ' ' + scfg.label + ' (this league\u002Fseason may not be in ESPN\\u2019s data)');\n      if (usedPrevSeason) problems.push(leagueCfg(league).label + ' ' + scfg.label + ' isn\\u2019t published by ESPN yet \\u2014 showing the most recent completed season\\u2019s teams and results instead.');\n      let matched = 0;\n      events.forEach((ev) => {\n        const comp = (ev.competitions || [])[0];\n        if (!comp) return;\n        let hc = null, ac = null, gh = null, ga = null, hEspnId = null, aEspnId = null, hShoot = null, aShoot = null;\n        (comp.competitors || []).forEach((c) => {\n          const t = c.team || {};\n          const code = this.registerTeam(teams, t.displayName || t.name || t.shortDisplayName || '?', t.abbreviation, t.color ? '#' + String(t.color).replace('#', '') : null, t.logo || (t.logos && t.logos[0] && t.logos[0].href) || null);\n          const shoot = c.shootoutScore != null ? num(c.shootoutScore) : null;\n          if (c.homeAway === 'home') { hc = code; gh = c.score != null ? num(c.score) : null; hEspnId = t.id; hShoot = shoot; }\n          else { ac = code; ga = c.score != null ? num(c.score) : null; aEspnId = t.id; aShoot = shoot; }\n        });\n        if (!hc || !ac) return;\n        matched++;\n        const stateStr = ev.status && ev.status.type ? ev.status.type.state : 'pre';\n        const week = ev.week && ev.week.number ? Number(ev.week.number) : null;\n        const venue = comp.venue && comp.venue.fullName ? comp.venue.fullName : null;\n\n        \u002F\u002F Knockout-cup metadata (no-op for domestic leagues, which don't have these ESPN\n        \u002F\u002F fields): used by the Bracket tab to group two-legged ties and label rounds, since\n        \u002F\u002F these competitions have no numeric \"week\" once the league phase ends.\n        const stage = ev.season && ev.season.slug ? ev.season.slug : null;\n        const legNum = comp.leg && comp.leg.value != null ? Number(comp.leg.value) : null;\n        const stageLabel = (comp.series && comp.series.title) || null;\n        const noteText = (comp.notes && comp.notes[0] && comp.notes[0].text) || null;\n        let winnerCode = null;\n        if (comp.series && comp.series.completed && Array.isArray(comp.series.competitors)) {\n          const wEntry = comp.series.competitors.find((sc) => sc.winner);\n          if (wEntry) {\n            if (String(wEntry.id) === String(hEspnId)) winnerCode = hc;\n            else if (String(wEntry.id) === String(aEspnId)) winnerCode = ac;\n          }\n        } else if (!comp.series && stateStr === 'post') {\n          \u002F\u002F Single-match ties (the final): penalties decide it when scores are level.\n          if (hShoot != null && aShoot != null && hShoot !== aShoot) winnerCode = hShoot > aShoot ? hc : ac;\n          else if (gh != null && ga != null && gh !== ga) winnerCode = gh > ga ? hc : ac;\n        }\n\n        const existing = this.matchFixtureByPair(fixtures, teams, hc, ac, ev.date, 7);\n        const patch = {\n          state: stateStr, gh: stateStr === 'pre' ? null : gh, ga: stateStr === 'pre' ? null : ga,\n          espnId: ev.id, src: 'espn',\n          stage, leg: legNum, stageLabel, noteText, winnerCode,\n        };\n        if (existing) {\n          fixtures[existing.uid] = Object.assign({}, existing, patch, {\n            date: ev.date, round: existing.round != null ? existing.round : week, venue: existing.venue || venue,\n          });\n        } else {\n          const uid = hc + '|' + ac + '|' + String(ev.date).slice(0, 10);\n          fixtures[uid] = Object.assign({ uid, round: week, date: ev.date, venue, home: hc, away: ac, ofFt: null }, patch);\n        }\n      });\n      sources.espnScores = { ok: true, ts: Date.now() };\n      if (!matched) throw new Error('no events parsed');\n    } catch (e) {\n      sources.espnScores = { ok: false, ts: Date.now(), err: String(e.message || e) };\n      problems.push('ESPN scores: ' + (e.message || e));\n    }\n    this.saveBucket(bid, { fixtures, teams, sources });\n\n    \u002F\u002F 2) openfootball (trusted historical source) + cross-verification vs ESPN\n    const lcfg = leagueCfg(league);\n    if (scfg.of && lcfg.ofCode) {\n      try {\n        this.setPhase(phasePrefix + 'openfootball: fetching & cross-checking…');\n        const d = await this.fetchJson(ofUrl(scfg.of, lcfg.ofCode));\n        const discrepancies = [];\n        let ofCount = 0, filled = 0;\n        (d.matches || []).forEach((mt) => {\n          if (!mt.team1 || !mt.team2) return;\n          const hc = this.registerTeam(teams, mt.team1, null, null);\n          const ac = this.registerTeam(teams, mt.team2, null, null);\n          const ft = mt.score && mt.score.ft && mt.score.ft.length === 2 ? mt.score.ft : null;\n          const roundNum = mt.round ? num(String(mt.round).replace(\u002F[^0-9]\u002Fg, '')) || null : null;\n          ofCount++;\n          const existing = this.matchFixtureByPair(fixtures, teams, hc, ac, mt.date, 3);\n          if (existing) {\n            const upd = Object.assign({}, existing, { ofFt: ft, round: existing.round != null ? existing.round : roundNum });\n            if (ft) {\n              if (existing.gh != null && (existing.gh !== ft[0] || existing.ga !== ft[1])) {\n                discrepancies.push({\n                  date: String(mt.date), home: teams[hc].name, away: teams[ac].name,\n                  espn: existing.gh + '\\u2013' + existing.ga, of: ft[0] + '\\u2013' + ft[1],\n                });\n              } else if (existing.gh == null) {\n                upd.gh = ft[0]; upd.ga = ft[1]; upd.state = 'post'; upd.src = 'of'; filled++;\n              }\n            }\n            fixtures[existing.uid] = upd;\n          } else {\n            const uid = hc + '|' + ac + '|' + String(mt.date);\n            fixtures[uid] = {\n              uid, round: roundNum, date: mt.date, venue: null, home: hc, away: ac,\n              state: ft ? 'post' : 'pre', gh: ft ? ft[0] : null, ga: ft ? ft[1] : null,\n              espnId: null, src: 'of', ofFt: ft,\n            };\n            if (ft) filled++;\n          }\n        });\n        sources.openfootball = { ok: true, ts: Date.now(), count: ofCount, filled };\n        this.saveBucket(bid, { fixtures, teams, sources, discrepancies });\n      } catch (e) {\n        sources.openfootball = { ok: false, ts: Date.now(), err: String(e.message || e) };\n        problems.push('openfootball: ' + (e.message || e));\n        this.saveBucket(bid, { sources });\n      }\n    }\n\n    \u002F\u002F 3) Standings: ESPN first, computed fallback\n    try {\n      this.setPhase(phasePrefix + 'League table…');\n      let standings = null, computed = false;\n      try {\n        const d = await this.fetchJson(espnStandUrl(league) + '?season=' + scfg.espnSeason);\n        const entries = (((d.children || [])[0] || {}).standings || {}).entries || [];\n        const rows = entries.map((en) => {\n          const get = (n) => { const s = (en.stats || []).find((x) => x.name === n); return s ? num(s.value) : 0; };\n          const code = this.findCodeByName(teams, en.team && (en.team.displayName || en.team.name));\n          return code ? {\n            code, rank: get('rank'), pts: get('points'), gd: get('pointDifferential'),\n            played: get('gamesPlayed'), win: get('wins'), draw: get('ties'), lose: get('losses'),\n            gf: get('pointsFor'), ga: get('pointsAgainst'),\n          } : null;\n        }).filter(Boolean);\n        if (rows.length >= 10) standings = rows;\n      } catch (e) {}\n      if (!standings) { standings = this.computeStandings(fixtures, teams); computed = true; }\n      if (standings && standings.length) {\n        this.saveBucket(bid, { standings, standingsComputed: computed });\n        sources.table = { ok: true, ts: Date.now() oints_per_game),\n          bonus: num(p.bonus), bps: num(p.bps), ict: num(p.ict_index),\n          xg: num(p.expected_goals), xa: num(p.expected_assists), xgi: num(p.expected_goal_involvements),\n          cleanSheets: num(p.clean_sheets), goalsConceded: num(p.goals_conceded), saves: num(p.saves),\n          transfersIn: num(p.transfers_in_event), transfersOut: num(p.transfers_out_event),\n        })).filter((p) => p.teamCode);\n        this.saveStoreTop({ fpl: { fetchedAt: Date.now(), sourceFetchedAt: d.fetched_at || null, players } });\n        sources.fpl = { ok: true, ts: Date.now() };\n      } catch (e) {\n        sources.fpl = { ok: false, ts: Date.now(), err: String(e.message || e) };\n        problems.push('FPL: ' + (e.message || e));\n      }\n      this.saveBucket(bid, { sources });\n    }\n\n    \u002F\u002F 5) ESPN match summaries (corners, cards, shots), capped — skipped during bulk\n    \u002F\u002F sync to keep a full \"sync all leagues\" pass fast; single-league sync still runs it.\n    if (!skipSummaries) {\n    try {\n      const missing = [];\n      const bNow = this.bucket(league, seasonKey);\n      Object.keys(bNow.fixtures).forEach((uid) => {\n        const f = bNow.fixtures[uid];\n        if (f.state === 'post' && f.espnId && !bNow.summaries[f.espnId]) missing.push(f);\n      });\n      const batch = missing.slice(0, SUMMARY_CAP);\n      let consecFail = 0;\n      for (let i = 0; i < batch.length; i++) {\n        this.setPhase(phasePrefix + 'ESPN: match statistics ' + (i + 1) + '\u002F' + batch.length + '…');\n        try { await this.fetchSummary(league, seasonKey, batch[i], true); consecFail = 0; }\n        catch (e) {\n          consecFail++;\n          \u002F\u002F Likely ESPN throttling; stop hammering and let the user re-sync later to resume.\n          if (consecFail >= 6) { problems.push('Match statistics paused after repeated errors (likely ESPN rate-limiting) — sync again later to fetch the rest.'); break; }\n        }\n        await delay(450);\n      }\n    } catch (e) { problems.push('Summaries: ' + (e.message || e)); }\n    }\n\n    this.saveBucket(bid, { lastSync: new Date().toISOString() });\n    return problems;\n  };\n\n  syncAll = async () => {\n    if (this.state.sync.running) return;\n    const league = this.state.league, seasonKey = this.state.seasonKey;\n    this.setState({ sync: { running: true, phase: 'Starting\\u2026', error: '' } });\n    let problems;\n    try { problems = await this.syncLeagueData(league, seasonKey); }\n    catch (e) { problems = [String(e.message || e)]; }\n    this.setState({ sync: { running: false, phase: '', error: problems.join('  \\u2022  ') } });\n  };\n\n  \u002F\u002F Loops every configured league (current season) through the same sync path, skipping the\n  \u002F\u002F slow per-match statistics pass so a full run stays reasonably quick and easy on ESPN's rate limit.\n  syncAllLeagues = async () => {\n    if (this.state.sync.running) return;\n    const seasonKey = this.state.seasonKey;\n    this.setState({ sync: { running: true, phase: 'Starting full sync\\u2026', error: '' } });\n    const allProblems = [];\n    for (let i = 0; i < LEAGUES.length; i++) {\n      const lg = LEAGUES[i];\n      const prefix = '(' + (i + 1) + '\u002F' + LEAGUES.length + ') ' + lg.label + ': ';\n      try {\n        const problems = await this.syncLeagueData(lg.key, seasonKey, { skipSummaries: true, phasePrefix: prefix });\n        problems.forEach((p) => allProblems.push(lg.label + ': ' + p));\n      } catch (e) {\n        allProblems.push(lg.label + ': ' + String(e.message || e));\n      }\n      await delay(300);\n    }\n    this.saveStoreTop({ lastFullSync: new Date().toISOString() });\n    this.setState({ sync: { running: false, phase: '', error: allProblems.join('  \\u2022  ') } });\n  };\n\n  computeStandings(fixtures, teams) {\n    const t = {};\n    Object.keys(teams).forEach((c) => { t[c] = { code: c, played: 0, win: 0, draw: 0, lose: 0, gf: 0, ga: 0, pts: 0 }; });\n    Object.keys(fixtures).forEach((uid) => {\n      const f = fixtures[uid];\n      if (f.state !== 'post' || f.gh == null || !t[f.home] || !t[f.away]) return;\n      const H = t[f.home], A = t[f.away];\n      H.played++; A.played++; H.gf += f.gh; H.ga += f.ga; A.gf += f.ga; A.ga += f.gh;\n      if (f.gh > f.ga) { H.win++; A.lose++; H.pts += 3; }\n      else if (f.gh < f.ga) { A.win++; H.lose++; A.pts += 3; }\n      else { H.draw++; A.draw++; H.pts++; A.pts++; }\n    });\n    const rows = Object.keys(t).map((c) => t[c]).filter((r) => r.played > 0);\n    rows.sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);\n    return rows.map((r, i) => Object.assign(r, { rank: i + 1, gd: r.gf - r.ga }));\n  }\n\n  parseSummary(d, homeCode, awayCode, teams) {\n    const list = (d.boxscore && d.boxscore.teams) || [];\n    const byCode = {};\n    list.forEach((t) => {\n      const code = this.findCodeByName(teams, t.team && (t.team.displayName || t.team.name));\n      if (code) byCode[code] = t.statistics || [];\n    });\n    const pick = (stats) => ({\n      possession: espnStat(stats, ['possessionpct', 'possession']),\n      shots: num(espnStat(stats, ['totalshots', 'shots'])),\n      sot: num(espnStat(stats, ['shotsontarget', 'shots on target', 'shotsongoal'])),\n      corners: num(espnStat(stats, ['woncorners', 'corner'])),\n      passesAcc: num(espnStat(stats, ['accuratepasses', 'accurate passes'])),\n      passesTot: num(espnStat(stats, ['totalpasses', 'passes'])),\n      fouls: num(espnStat(stats, ['foulscommitted', 'fouls'])),\n      yc: num(espnStat(stats, ['yellowcards', 'yellow'])),\n      rc: num(espnStat(stats, ['redcards', 'red card'])),\n      offsides: num(espnStat(stats, ['offsides', 'offside'])),\n    });\n    if (!byCode[homeCode] || !byCode[awayCode]) return null;\n    return {\n      homeCode, awayCode, home: pick(byCode[homeCode]), away: pick(byCode[awayCode]),\n      goals: this.pickPlayers(d, homeCode, awayCode, teams),\n    };\n  }\n\n  \u002F\u002F Per-player goals\u002Fassists\u002Fown-goals for the match, keyed by home\u002Faway — sourced from\n  \u002F\u002F ESPN's boxscore \"rosters\" list (each player's full-match totals). No per-goal minute\n  \u002F\u002F is available from this endpoint, only match totals per player.\n  pickPlayers(d, homeCode, awayCode, teams) {\n    const rosters = d.rosters || [];\n    const sides = {};\n    rosters.forEach((r) => {\n      const code = this.findCodeByName(teams, r.team && (r.team.displayName || r.team.name));\n      if (!code) return;\n      const list = (r.roster || []).map((p) => {\n        const st = (name) => {\n          const s = (p.stats || []).find((x) => x.name === name);\n          return s && s.value != null ? s.value : 0;\n        };\n        return {\n          id: p.athlete ? p.athlete.id : null,\n          name: p.athlete ? (p.athlete.shortName || p.athlete.displayName || 'Unknown') : 'Unknown',\n          goals: st('totalGoals'), assists: st('goalAssists'), ownGoals: st('ownGoals'),\n          yc: st('yellowCards'), rc: st('redCards'),\n        };\n      }).filter((p) => p.goals > 0 || p.assists > 0 || p.ownGoals > 0 || p.yc > 0 || p.rc > 0);\n      sides[code] = list;\n    });\n    return { home: sides[homeCode] || [], away: sides[awayCode] || [] };\n  }\n\n  async fetchSummary(league, seasonKey, fixture, persist) {\n    const bid = this.bucketId(league, seasonKey);\n    const b = this.bucket(league, seasonKey);\n    const d = await this.fetchJson(espnSummaryUrl(league) + '?event=' + fixture.espnId);\n    const parsed = this.parseSummary(d, fixture.home, fixture.away, b.teams);\n    if (persist && parsed) {\n      const summaries = Object.assign({}, this.bucket(league, seasonKey).summaries);\n      summaries[fixture.espnId] = parsed;\n      this.saveBucket(bid, { summaries });\n    }\n    return parsed;\n  }\n\n  \u002F\u002F ---- Detail helpers ------------------------------------------------------------\n\n  fixtureByUid(u
