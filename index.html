 seasonKey);\n    const d = await this.fetchJson(espnSummaryUrl(league) + '?event=' + fixture.espnId);\n    const parsed = this.parseSummary(d, fixture.home, fixture.away, b.teams);\n    if (persist && parsed) {\n      const summaries = Object.assign({}, this.bucket(league, seasonKey).summaries);\n      summaries[fixture.espnId] = parsed;\n      this.saveBucket(bid, { summaries });\n    }\n    return parsed;\n  }\n\n  \u002F\u002F ---- Detail helpers ------------------------------------------------------------\n\n  fixtureByUid(uid) { return this.bucket().fixtures[uid] || null; }\n\n  h2hAcrossAll(m) {\n    const bx = this.bucket();\n    const n1 = normName((bx.teams[m.home] || {}).name), n2 = normName((bx.teams[m.away] || {}).name);\n    const rows = [];\n    Object.keys(this.state.store.buckets).forEach((bid) => {\n      const b = this.state.store.buckets[bid];\n      const parts = bid.split('|');\n      const lgLabel = (LEAGUES.find((l) => l.key === parts[0]) || {}).label || parts[0];\n      Object.keys(b.fixtures || {}).forEach((uid) => {\n        const f = b.fixtures[uid];\n        const hn = normName((b.teams[f.home] || {}).name), an = normName((b.teams[f.away] || {}).name);\n        const samePair = (hn === n1 && an === n2) || (hn === n2 && an === n1);\n        if (!samePair) return;\n        rows.push({\n          date: new Date(f.date),\n          dateLabel: new Date(f.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),\n          homeName: (b.teams[f.home] || {}).name, awayName: (b.teams[f.away] || {}).name,\n          score: f.gh != null ? f.gh + '\\u2013' + f.ga : (f.round ? 'MW ' + f.round : 'upcoming'),\n          comp: lgLabel,\n        });\n      });\n    });\n    rows.sort((a, b) => b.date - a.date);\n    return rows.slice(0, 10);\n  }\n\n  loadMatchExtras(m) {\n    const uid = m.uid;\n    if (m.state === 'post' && m.espnId && !this.bucket().summaries[m.espnId]) {\n      this.setState({ detail: { sumState: 'loading', sumError: '' } });\n      const league = this.state.league, seasonKey = this.state.seasonKey;\n      this.fetchSummary(league, seasonKey, m, true).then(() => {\n        if (this.state.selectedMatchUid === uid) this.setState({ detail: { sumState: 'done', sumError: '' } });\n      }).catch((e) => {\n        if (this.state.selectedMatchUid === uid) this.setState({ detail: { sumState: 'error', sumError: String(e.message || e) } });\n      });\n    } else {\n      this.setState({ detail: { sumState: 'idle', sumError: '' } });\n    }\n  }\n\n  availabilityFor(code) {\n    if (this.state.league !== 'eng.1' || this.state.seasonKey !== '2026-27') return null;\n    const fpl = this.state.store.fpl;\n    if (!fpl) return null;\n    return fpl.players\n      .filter((p) => p.teamCode === code && p.status && p.status !== 'a')\n      .map((p) => ({\n        name: p.name,\n        reason: (FPL_STATUS[p.status] || 'Unavailable') +\n          (p.chance != null ? ' (' + p.chance + '% chance)' : '') +\n          (p.news ? ' \\u2014 ' + p.news : ''),\n      }));\n  }\n\n  teamLastFive(code) {\n    const b = this.bucket();\n    const rows = [];\n    Object.keys(b.fixtures).forEach((uid) => {\n      const f = b.fixtures[uid];\n      if (f.state !== 'post' || f.gh == null) return;\n      if (f.home !== code && f.away !== code) return;\n      const mine = f.home === code ? f.gh : f.ga;\n      const theirs = f.home === code ? f.ga : f.gh;\n      rows.push({ date: f.date, letter: mine > theirs ? 'W' : mine === theirs ? 'D' : 'L' });\n    });\n    rows.sort((a, b2) => new Date(b2.date) - new Date(a.date));\n    return rows.slice(0, 5).reverse().map((r) => r.letter);\n  }\n\n  standingRow(code) {\n    const b = this.bucket();\n    return (b.standings || []).find((r) => r.code === code) || null;\n  }\n\n  formPoints(letters) {\n    return letters.reduce((s, ch) => s + (ch === 'W' ? 3 : ch === 'D' ? 1 : 0), 0);\n  }\n\n  h2hSummaryFor(m) {\n    const rows = this.h2hAcrossAll(m).filter((r) => r.score.indexOf('\\u2013') !== -1);\n    let hw = 0, aw = 0, dr = 0;\n    const b = this.bucket();\n    const homeName = normName((b.teams[m.home] || {}).name);\n    rows.forEach((r) => {\n      const parts = r.score.split('\\u2013');\n      const gh = num(parts[0]), ga = num(parts[1]);\n      const rowHomeIsMatchHome = normName(r.homeName) === homeName;\n      const matchHomeGoals = rowHomeIsMatchHome ? gh : ga;\n      const matchAwayGoals = rowHomeIsMatchHome ? ga : gh;\n      if (matchHomeGoals > matchAwayGoals) hw++;\n      else if (matchHomeGoals < matchAwayGoals) aw++;\n      else dr++;\n    });\n    return { hw, aw, dr, n: rows.length };\n  }\n\n  \u002F\u002F Transparent, explainable win-lean heuristic. NOT a calibrated model and NOT betting advice.\n  \u002F\u002F Every input is surfaced to the user so they can see why it leans the way it does.\n  computeAnalysis(m) {\n    const home = this.standingRow(m.home), away = this.standingRow(m.away);\n    const homeForm = this.teamLastFive(m.home), awayForm = this.teamLastFive(m.away);\n    const h2h = this.h2hSummaryFor(m);\n    const factors = [];\n    \u002F\u002F Each factor contributes a signed weight toward home (+) or away (-).\n    let score = 0;\n\n    \u002F\u002F Home advantage (fixed prior)\n    score += 0.35; factors.push({ label: 'Home advantage', detail: 'baseline edge to the home side', dir: 'home', strength: 'small' });\n\n    \u002F\u002F Points per game\n    if (home && away && home.played > 0 && away.played > 0) {\n      const hppg = home.pts \u002F home.played, appg = away.pts \u002F away.played;\n      const diff = hppg - appg;\n      score += diff * 0.9;\n      if (Math.abs(diff) >= 0.15) factors.push({\n        label: 'Season points\u002Fgame', detail: hppg.toFixed(2) + ' vs ' + appg.toFixed(2),\n        dir: diff > 0 ? 'home' : 'away', strength: Math.abs(diff) > 0.6 ? 'strong' : 'medium',\n      });\n    }\n\n    \u002F\u002F League position\n    if (home && away) {\n      const gap = away.rank - home.rank; \u002F\u002F positive => home ranked higher (better)\n      score += gap * 0.03;\n      if (Math.abs(gap) >= 3) factors.push({\n        label: 'League position', detail: '#' + home.rank + ' vs #' + away.rank,\n        dir: gap > 0 ? 'home' : 'away', strength: Math.abs(gap) > 8 ? 'strong' : 'medium',\n      });\n    }\n\n    \u002F\u002F Recent form (last 5)\n    const hf = this.formPoints(homeForm), af = this.formPoints(awayForm);\n    if (homeForm.length && awayForm.length) {\n      const diff = (hf - af) \u002F 5;\n      score += diff * 0.5;\n      if (Math.abs(hf - af) >= 3) factors.push({\n        label: 'Recent form (last 5)', detail: hf + ' pts vs ' + af + ' pts',\n        dir: hf > af ? 'home' : 'away', strength: Math.abs(hf - af) >= 7 ? 'strong' : 'medium',\n      });\n    }\n\n    \u002F\u002F Goal difference per game\n    if (home && away && home.played > 0 && away.played > 0) {\n      const hgd = home.gd \u002F home.played, agd = away.gd \u002F away.played;\n      const diff = hgd - agd;\n      score += diff * 0.35;\n      if (Math.abs(diff) >= 0.4) factors.push({\n        label: 'Goal difference\u002Fgame', detail: (hgd >= 0 ? '+' : '') + hgd.toFixed(2) + ' vs ' + (agd >= 0 ? '+' : '') + agd.toFixed(2),\n        dir: diff > 0 ? 'home' : 'away', strength: Math.abs(diff) > 1 ? 'strong' : 'medium',\n      });\n    }\n\n    \u002F\u002F Head-to-head\n    if (h2h.n >= 2) {\n      const diff = (h2h.hw - h2h.aw) \u002F h2h.n;\n      score += diff * 0.4;\n      if (h2h.hw !== h2h.aw) factors.push({\n        label: 'Head-to-head', detail: h2h.hw + 'W \\u2013 ' + h2h.dr + 'D \\u2013 ' + h2h.aw + 'L (home\\u2019s view, ' + h2h.n + ' games)',\n        dir: h2h.hw > h2h.aw ? 'home' : 'away', strength: Math.abs(h2h.hw - h2h.aw) >= 3 ? 'medium' : 'small',\n      });\n    }\n\n    \u002F\u002F Convert the score into a rough three-way lean via a logistic-ish split.\n    \u002F\u002F This is deliberately naive: it is a readable summary of the factors above, not a market probability.\n    const hAdv = 1 \u002F (1 + Math.exp(-score));           \u002F\u002F 0..1 toward home over away\n    const drawShare = 0.26;                              \u002F\u002F fixed, typical football draw rate ballpark\n    const homeP = Math.round(hAdv * (1 - drawShare) * 100);\n    const awayP = Math.round((1 - hAdv) * (1 - drawShare) * 100);\n    const drawP = 100 - homeP - awayP;\n\n    let lean, leanDir;\n    if (Math.abs(homeP - awayP) < 8) { lean = 'Too close to call'; leanDir = 'even'; }\n    else if (homeP > awayP) { lean = m.home; leanDir = 'home'; }\n    else { lean = m.away; leanDir = 'away'; }\n\n    const dataThin = !(home && away && homeForm.length && awayForm.length);\n    return { homeP, drawP, awayP, lean, leanDir, factors, dataThin, hasStandings: !!(home && away) };\n  }\n\n  \u002F\u002F ---- UI handlers ------------------------------------------------------------------\n\n  stopClick = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };\n  toggleMobileMode = () => {\n    const next = !this.state.mobileMode;\n    try { localStorage.setItem('tefa_mobile_mode', String(next)); } catch (e) {}\n    this.setState({ mobileMode: next });\n  };\n  goTabFixtures = () => this.setState({ tab: 'fixtures', selectedMatchUid: null });\n  goTabTable = () => this.setState({ tab: 'table', selectedMatchUid: null });\n  goTabStats = () => this.setState({ tab: 'stats', selectedMatchUid: null });\n  goTabFavorites = () => this.setState({ tab: 'favorites', selectedMatchUid: null });\n  goTabFpl = () => this.setState({ tab: 'fpl', selectedMatchUid: null });\n  goTabBracket = () => this.setState({ tab: 'bracket', selectedMatchUid: null });\n  sortFpl = (key) =>\n    this.setState((s) => (s.fplSortKey === key ? { fplSortDir: -s.fplSortDir } : { fplSortKey: key, fplSortDir: -1 }));\n  setFplPos = (pos) => this.setState({ fplPosFilter: pos });\n  onFplSearch = (e) => this.setState({ fplSearch: e.target.value });\n\n  togglePlayerHistory = (id) => {\n    const isOpen = this.state.fplExpanded === id;\n    this.setState({ fplExpanded: isOpen ? null : id });\n    if (!isOpen && !this.state.fplHistory[id]) this.loadPlayerHistory(id);\n  };\n\n  \u002F\u002F Reads the daily-synced fpl-history.json (same-origin, no CORS relay needed) instead of\n  \u002F\u002F calling FPL's element-summary endpoint straight from the browser, which FPL blocks via\n  \u002F\u002F CORS and which previously depended on flaky public CORS relays as a workaround.\n  loadFplHistoryFile = async () => {\n    if (this.state.store.fplHistoryCache) return this.state.store.fplHistoryCache;\n    const res = await fetch('fpl-history.json?t=' + Date.now(), { cache: 'no-store' });\n    if (!res.ok) throw new Error('HTTP ' + res.status + ' — has the fpl-sync GitHub Action run yet?');\n    const d = await res.json();\n    this.saveStoreTop({ fplHistoryCache: d });\n    return d;\n  };\n\n  loadPlayerHistory = async (id) => {\n    this.setState((s) => ({ fplHistory: Object.assign({}, s.fplHistory, { [id]: { status: 'loading' } }) }));\n    try {\n      const cache = await this.loadFplHistoryFile();\n      const past = (cache.players && cache.players[id]) || [];\n      const seasons = past.slice().reverse().map((h) => ({\n        season: h.season_name,\n        points: num(h.total_points), minutes: num(h.minutes),\n        goals: num(h.goals_scored), assists: num(h.assists),\n        startPrice: '£' + (num(h.start_cost) \u002F 10).toFixed(1) + 'm',\n        endPrice: '£' + (num(h.end_cost) \u002F 10).toFixed(1) + 'm',\n      }));\n      this.setState((s) => ({ fplHistory: Object.assign({}, s.fplHistory, { [id]: { status: 'ok', seasons } }) }));\n    } catch (e) {\n      this.setState((s) => ({ fplHistory: Object.assign({}, s.fplHistory, { [id]: { status: 'error', error: String(e.message || e) } }) }));\n    }\n  };\n  goFixtures = () => this.setState({ segment: 'fixtures' });\n  goResults = () => this.setState({ segment: 'results' });\n  goLive = () => this.setState({ segment: 'live' });\n  goStatsTeams = () => this.setState({ statsSeg: 'teams' });\n  goStatsPlayers = () => this.setState({ statsSeg: 'players' });\n  setLeague = (key) => this.setState({ league: key, periodIdx: null, selectedMatchUid: null, sync: { running: this.state.sync.running, phase: this.state.sync.phase, error: '' } });\n  setTier = (t) => this.setState((s) => {\n    const cur = leagueCfg(s.league);\n    const patch = { leagueTier: t };\n    if (!cur || cur.tier !== t) {\n      const first = LEAGUES.find((l) => l.tier === t);\n      if (first) { patch.league = first.key; patch.periodIdx = null; patch.selectedMatchUid = null; }\n    }\n    return patch;\n  });\n  setSeason = (key) => this.setState({ seasonKey: key, periodIdx: null, selectedMatchUid: null, sync: { running: this.state.sync.running, phase: this.state.sync.phase, error: '' } });\n  prevRound = () => this.setState((s) => ({ periodIdx: Math.max(0, (s.periodIdx == null ? this.defaultPeriodIdx() : s.periodIdx) - 1) }));\n  nextRound = () => this.setState((s) => ({ periodIdx: Math.min(this.periods().length - 1, (s.periodIdx == null ? this.defaultPeriodIdx() : s.periodIdx) + 1) }));\n  openMatch = (uid) => {\n    this.setState({ selectedMatchUid: uid });\n    const m = this.fixtureByUid(uid);\n    if (m) this.loadMatchExtras(m);\n  };\n  closeMatch = () => this.setState({ selectedMatchUid: null });\n  toggleEditFavorites = () => this.setState((s) => ({ editingFavorites: !s.editingFavorites }));\n  toggleFollow = (code) =>\n    this.setState((s) => {\n      const has = s.followed.includes(code);\n      return { followed: has ? s.followed.filter((c) => c !== code) : [...s.followed, code] };\n    });\n  sortStats = (key) =>\n    this.setState((s) => (s.sortKey === key ? { sortDir: -s.sortDir } : { sortKey: key, sortDir: -1 }));\n\n  \u002F\u002F ---- Periods (matchweeks or months) --------------------------------------------\n\n  fixtureList() {\n    const b = this.bucket();\n    return Object.keys(b.fixtures).map((uid) => b.fixtures[uid]);\n  }\n\n  periods() {\n    const list = this.fixtureList();\n    if (!list.length) return [];\n    const withRound = list.filter((f) => f.round != null).length;\n    if (withRound >= list.length * 0.5) {\n      const rounds = {};\n      const unrounded = [];\n      list.forEach((f) => {\n        if (f.round != null) (rounds[f.round] = rounds[f.round] || []).push(f);\n        else unrounded.push(f);\n      });\n      const roundPeriods = Object.keys(rounds).map(Number).sort((a, b) => a - b).map((r) => ({\n        label: 'Matchweek ' + r,\n        matches: rounds[r].slice().sort((a, b) => new Date(a.date) - new Date(b.date)),\n      }));\n      if (!unrounded.length) return roundPeriods;\n      const byMonth = {};\n      unrounded.forEach((f) => { const k = String(f.date).slice(0, 7); (byMonth[k] = byMonth[k] || []).push(f); });\n      const unroundedPeriods = Object.keys(byMonth).sort().map((k) => ({\n        label: new Date(k + '-15').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }),\n        matches: byMonth[k].slice().sort((a, b) => new Date(a.date) - new Date(b.date)),\n      }));\n      const merged = [...roundPeriods, ...unroundedPeriods];\n      merged.sort((a, b) => new Date(a.matches[0].date) - new Date(b.matches[0].date));\n      return merged;\n    }\n    const months = {};\n    list.forEach((f) => { const k = String(f.date).slice(0, 7); (months[k] = months[k] || []).push(f); });\n    return Object.keys(months).sort().map((k) => ({\n      label: new Date(k + '-15').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }),\n      matches: months[k].slice().sort((a, b) => new Date(a.date) - new Date(b.date)),\n    }));\n  }\n\n  defaultPeriodIdx() {\n    const ps = this.periods();\n    const now = this.state.now;\n    for (let i = 0; i < ps.length; i++) {\n      const last = ps[i].matches[ps[i].matches.length - 1];\n      if (now <= new Date(new Date(last.date).getTime() + 115 * 60000)) return i;\n    }\n    return Math.max(0, ps.length - 1);\n  }\n\n  \u002F\u002F ---- Presentation --------------------------------------------------------------\n\n  teamName(code) { const b = this.bucket(); return (b.teams[code] && b.teams[code].name) || code; }\n  teamColor(code) { const b = this.bucket(); return (b.teams[code] && b.teams[code].color) || '#555555'; }\n  teamLogo(code) { const b = this.bucket(); return (b.teams[code] && b.teams[code].logo) || null; }\n\n  contrastText(color) {\n    if (String(color).indexOf('#') !== 0) return '#FFFFFF';\n    const c = color.replace('#', '');\n    if (c.length < 6) return '#FFFFFF';\n    const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), bl = parseInt(c.substr(4, 2), 16);\n    const yiq = (r * 299 + g * 587 + bl * 114) \u002F 1000;\n    return yiq >= 150 ? '#14171C' : '#FFFFFF';\n  }\n\n  fmtDateHeader(d) { return new Date(d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }\n  fmtTime(d) { const s = new Date(d); return isNaN(s) || String(d).length <= 10 ? '\\u2013' : s.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }); }\n  fmtFullDate(d) { return new Date(d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }\n\n  countdown(dateStr, now) {\n    const diff = new Date(dateStr) - now;\n    if (diff <= 0) return 'kicking off';\n    const days = Math.floor(diff \u002F 86400000);\n    if (days > 0) return 'in ' + days + (days === 1 ? ' day' : ' days');\n    const hours = Math.floor(diff \u002F 3600000);\n    if (hours > 0) return 'in ' + hours + (hours === 1 ? ' hour' : ' hours');\n    const mins = Math.max(1, Math.floor(diff \u002F 60000));\n    return 'in ' + mins + (mins === 1 ? ' min' : ' mins');\n  }\n\n  formChipsFromLetters(letters, keyPrefix) {\n    return letters.map((ch, i) => ({\n      key: keyPrefix + i, letter: ch,\n      bg: ch === 'W' ? '#16A34A' : ch === 'D' ? '#9CA3AF' : '#DC2626',\n    }));\n  }\n\n  effectiveStatus(f, now) {\n    if (f.state === 'in') return 'live';\n    if (f.state === 'post') return 'finished';\n    if (f.src !== 'builtin') return 'upcoming';\n    const kickoff = new Date(f.date);\n    if (now < kickoff) return 'upcoming';\n    if (now <= new Date(kickoff.getTime() + 115 * 60000)) return 'live';\n    return 'finished';\n  }\n\n  \u002F\u002F ---- Knockout bracket (UEFA cups: Champions\u002FEuropa\u002FConference League) -------------\n  \u002F\u002F Builds one entry per knockout round (playoffs, R16, QF, SF, final), each holding\n  \u002F\u002F \"ties\" — one or two legs between the same two teams, grouped purely from synced\n  \u002F\u002F fixture data (no dependency on the league-phase standings table, which stops\n  \u002F\u002F applying once a competition moves into single-elimination rounds).\n  bracketRounds() {\n    const STAGE_ORDER = ['knockout-round-playoffs', 'round-of-16', 'quarterfinals', 'semifinals', 'final'];\n    const STAGE_FALLBACK_LABEL = {\n      'knockout-round-playoffs': 'Knockout Play-offs', 'round-of-16': 'Round of 16',\n      quarterfinals: 'Quarterfinals', semifinals: 'Semifinals', final: 'Final',\n    };\n    const list = this.fixtureList().filter((f) => f.stage && f.stage !== 'league-phase');\n    if (!list.length) return [];\n    const byStage = {};\n    list.forEach((f) => { (byStage[f.stage] = byStage[f.stage] || []).push(f); });\n    const stageKeys = Object.keys(byStage).sort((a, b) => {\n      const ia = STAGE_ORDER.indexOf(a), ib = STAGE_ORDER.indexOf(b);\n      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);\n    });\n\n    let prevIndex = {}; \u002F\u002F team code -> tie index in the previously processed round\n    let haveOrder = false;\n    const now = this.state.now;\n\n    return stageKeys.map((stageKey) => {\n      const matches = byStage[stageKey];\n      const label = matches[0].stageLabel || STAGE_FALLBACK_LABEL[stageKey] || stageKey;\n\n      const groups = {};\n      matches.forEach((f) => {\n        const key = [f.home, f.away].sort().join('|');\n        (groups[key] = groups[key] || []).push(f);\n      });\n\n      \u002F\u002F Order ties so each round reads top-to-bottom consistent with the previous one —\n      \u002F\u002F a tie's position is derived from its two teams' tie positions in the prior round,\n      \u002F\u002F so e.g. a quarterfinal naturally sorts near the two round-of-16 ties that fed it.\n      let orderedKeys;\n      if (haveOrder) {\n        orderedKeys = Object.keys(groups).map((key) => {\n          const [ta, tb] = key.split('|');\n          const known = [prevIndex[ta], prevIndex[tb]].filter((v) => v != null);\n          return { key, sortKey: known.length ? Math.min.apply(null, known) : 999 };\n        }).sort((a, b) => a.sortKey - b.sortKey).map((o) => o.key);\n      } else {\n        orderedKeys = Object.keys(groups).sort((a, b) => {\n          const da = Math.min.apply(null, groups[a].map((f) => new Date(f.date).getTime()));\n          const db = Math.min.apply(null, groups[b].map((f) => new Date(f.date).getTime()));\n          return da - db;\n        });\n      }\n\n      const nextIndex = {};\n      const ties = orderedKeys.map((key, idx) => {\n        const legs = groups[key].slice().sort((a, b) => (a.leg || 1) - (b.leg || 1) || new Date(a.date) - new Date(b.date));\n        const [teamA, teamB] = key.split('|');\n        nextIndex[teamA] = idx; nextIndex[teamB] = idx;\n\n        let aggA = 0, aggB = 0, playedLegs = 0;\n        legs.forEach((f) => {\n          if (f.gh == null || f.ga == null) return;\n          playedLegs++;\n          if (f.home === teamA) { aggA += f.gh; aggB += f.ga; } else { aggA += f.ga; aggB += f.gh; }\n        });\n        const winnerCode = (legs.find((f) => f.winnerCode) || {}).winnerCode || null;\n        const noteText = (legs.slice().reverse().find((f) => f.noteText) || {}).noteText || null;\n        const hasAgg = legs.le = 0.45 ? 'leans Under 4.5' : 'no clear lean'),\n      };\n\n      \u002F\u002F Analysis heuristic\n      const an = this.computeAnalysis(f);\n      const barColor = { home: f.home === an.lean ? '#0D9488' : 'rgba(20,23,28,0.35)' };\n      const analysisFactors = an.factors.map((x, i) => ({\n        key: 'af' + i, label: x.label, detail: x.detail,\n        who: x.dir === 'home' ? this.teamName(f.home) : x.dir === 'away' ? this.teamName(f.away) : '\\u2014',\n        chipBg: x.dir === 'home' ? 'rgba(13,148,136,0.12)' : x.dir === 'away' ? 'rgba(180,83,9,0.12)' : 'rgba(0,0,0,0.05)',\n        chipColor: x.dir === 'home' ? '#0D7A70' : x.dir === 'away' ? '#92400E' : 'rgba(20,23,28,0.6)',\n        strength: x.strength,\n      }));\n      const leanLabel = an.leanDir === 'even' ? 'Too close to call' :\n        'Leans ' + (an.leanDir === 'home' ? this.teamName(f.home) : this.teamName(f.away));\n\n      const injHome = this.availabilityFor(f.home);\n      const injAway = this.availabilityFor(f.away);\n      const fplSynced = injHome !== null;\n      const anyBucketSynced = Object.keys(this.state.store.buckets).some((k) => this.state.store.buckets[k].lastSync);\n\n      detailVals = {\n        hasScore, noScore: !hasScore,\n        scoreLabel: hasScore ? f.gh + ' \\u2013 ' + f.ga : '',\n        hasStatRows: statRows.length > 0, statRows,\n        hasGoals: goalsInfo.ready, goalsInfo,\n        statsPending: d.sumState === 'loading' && !fs,\n        statsFailed: d.sumState === 'error' && !fs,\n        sumError: d.sumError,\n        hasForm: !!(homeForm.length || awayForm.length),\n        homeFormChips: this.formChipsFromLetters(homeForm, 'dh'), awayFormChips: this.formChipsFromLetters(awayForm, 'da'),\n        h2hHasRows: h2h.length > 0, h2hEmpty: h2h.length === 0 && anyBucketSynced, h2hNoKey: h2h.length === 0 && !anyBucketSynced,\n        h2hRows: h2h.map((x) => ({ dateLabel: x.dateLabel, homeName: x.homeName, awayName: x.awayName, score: x.score })),\n        h2hNote: 'Across al
