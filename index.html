document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"c2536094-7577-48a0-bd85-13c1a6f0dafd\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<style>\n  body { margin: 0; }\n  a { color: #0D9488; text-decoration: none; }\n  a:hover { color: #115E59; }\n  @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background-color:#D6E4F5;background-image:radial-gradient(circle at 50% -8%, rgba(255,255,255,0.6), rgba(255,255,255,0) 55%), radial-gradient(rgba(255,255,255,0.82) 1.3px, transparent 1.4px);background-size:auto, 22px 22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;box-sizing:border-box\">\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:{{ headerPadY }} 40px;border-bottom:1px solid rgba(0,0,0,0.08);position:sticky;top:0;background:rgba(214,228,245,0.85);backdrop-filter:blur(8px);z-index:10\">\n    <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:baseline;gap:10px\">\n        <div style=\"font-size:20px;font-weight:800;color:#14171C\">{{ leagueLabel }}<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;color:rgba(20,23,28,0.55)\">{{ seasonHeaderLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ toggleMobileMode }}\" style=\"padding:6px 14px;border-radius:8px;background:{{ mobileToggleBg }};color:{{ mobileToggleColor }};font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;user-select:none\">📱 {{ mobileToggleLabel }}<\u002Fdiv>\n      <div style=\"display:flex;gap:4px;background:rgba(0,0,0,0.05);padding:4px;border-radius:10px\">\n        <sc-for list=\"{{ tierOptions }}\" as=\"ti\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-click=\"{{ ti.click }}\" style=\"padding:{{ pillPadY }} {{ pillPadX }};border-radius:7px;font-size:{{ pillFontSize }};font-weight:800;cursor:pointer;white-space:{{ pillWrap }};background:{{ ti.bg }};color:{{ ti.color }}\">{{ ti.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:13px;padding:2px 10px 2px 2px\">\n        <svg width=\"48\" height=\"48\" viewBox=\"0 0 32 32\" xmlns=\"http:\u002F\u002Fwww.w3.org\u002F2000\u002Fsvg\">\n          <defs><linearGradient id=\"tefaG\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#0D9488\"\u002F><stop offset=\"1\" stop-color=\"#0B6E63\"\u002F><\u002FlinearGradient><\u002Fdefs>\n          <rect x=\"1\" y=\"1\" width=\"30\" height=\"30\" rx=\"9\" fill=\"url(#tefaG)\"\u002F>\n          <polyline points=\"6,23 12,18 19,20 25,10.5\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\"0.95\"\u002F>\n          <circle cx=\"6\" cy=\"23\" r=\"1.5\" fill=\"#FFFFFF\" opacity=\"0.9\"\u002F>\n          <circle cx=\"12\" cy=\"18\" r=\"1.5\" fill=\"#FFFFFF\" opacity=\"0.9\"\u002F>\n          <circle cx=\"19\" cy=\"20\" r=\"1.5\" fill=\"#FFFFFF\" opacity=\"0.9\"\u002F>\n          <circle cx=\"25\" cy=\"10.5\" r=\"3.4\" fill=\"#FFFFFF\"\u002F>\n          <circle cx=\"25\" cy=\"10.5\" r=\"3.4\" fill=\"none\" stroke=\"#0B6E63\" stroke-width=\"0.8\"\u002F>\n          <path d=\"M25 7.6 L25.7 9.4 L24.3 9.4 Z\" fill=\"#0B6E63\"\u002F>\n        <\u002Fsvg>\n        <div style=\"display:flex;align-items:baseline;gap:{{ brandGap }};white-space:{{ brandWrapStyle }};max-width:100%\">\n          <span style=\"font-size:{{ brandFontSize }};font-weight:900;letter-spacing:0.03em;color:#14171C\">TEFA<\u002Fspan>\n          <span style=\"font-size:{{ brandTagFontSize }};font-weight:600;letter-spacing:0.005em;color:rgba(20,23,28,0.58)\">— Timos European Football Analyzer<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:5px;flex-wrap:wrap;flex:1 1 100%;padding:4px;background:rgba(255,255,255,0.55);border-radius:10px\">\n        <sc-for list=\"{{ leagueOptions }}\" as=\"lo\" hint-placeholder-count=\"6\">\n          <div sc-camel-on-click=\"{{ lo.click }}\" style=\"padding:{{ pillPadY }} {{ pillPadX }};border-radius:7px;font-size:{{ pillFontSize }};font-weight:700;cursor:pointer;white-space:{{ pillWrap }};background:{{ lo.bg }};color:{{ lo.color }}\">{{ lo.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:4px;background:rgba(0,0,0,0.05);padding:4px;border-radius:10px\">\n        <sc-for list=\"{{ seasonOptions }}\" as=\"so\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ so.click }}\" style=\"padding:{{ pillPadY }} {{ pillPadX }};border-radius:7px;font-size:{{ pillFontSize }};font-weight:700;cursor:pointer;background:{{ so.bg }};color:{{ so.color }}\">{{ so.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:28px\">\n      <div sc-camel-on-click=\"{{ goTabFixtures }}\" style=\"cursor:pointer;font-size:14.5px;font-weight:700;color:{{ tabFixturesColor }};padding-bottom:4px;border-bottom:2px solid {{ tabFixturesBorder }}\">Fixtures<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goTabTable }}\" style=\"cursor:pointer;font-size:14.5px;font-weight:700;color:{{ tabTableColor }};padding-bottom:4px;border-bottom:2px solid {{ tabTableBorder }}\">Table<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goTabStats }}\" style=\"cursor:pointer;font-size:14.5px;font-weight:700;color:{{ tabStatsColor }};padding-bottom:4px;border-bottom:2px solid {{ tabStatsBorder }}\">Stats<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goTabFavorites }}\" style=\"cursor:pointer;font-size:14.5px;font-weight:700;color:{{ tabFavoritesColor }};padding-bottom:4px;border-bottom:2px solid {{ tabFavoritesBorder }}\">Favorites<\u002Fdiv>\n      <div      <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.7);width:min(94vw,1560px);margin-left:50%;transform:translateX(-50%)\">\n          <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.55);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Column key<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 20px\">\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">P<\u002Fstrong> — Played<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">W \u002F D \u002F L<\u002Fstrong> — Won \u002F Drawn \u002F Lost<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">GF \u002F GA<\u002Fstrong> — Goals For \u002F Against<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">GD<\u002Fstrong> — Goal Difference<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">Pts<\u002Fstrong> — Points<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">Home \u002F Away W-D-L<\u002Fstrong> — record split by venue<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#0D7A70\">O2.5%<\u002Fstrong> — share of the team's matches with 3+ total goals (Over 2.5)<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#0D7A70\">BTTS%<\u002Fstrong> — share where both teams scored<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">Avg G<\u002Fstrong> — average total goals per match<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">CS<\u002Fstrong> — Clean Sheets (kept a shutout)<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">FTS<\u002Fstrong> — Failed To Score<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#B45309\">YC\u002F90<\u002Fstrong> — yellow cards per match<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#DC2626\">RC<\u002Fstrong> — red cards (total)<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#B45309\">Crd\u002Fm<\u002Fstrong> — average total cards per match<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">Corn F\u002F90 · A\u002F90<\u002Fstrong> — average corners won \u002F conceded per match<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(20,23,28,0.7);line-height:1.5\"><strong style=\"color:#14171C\">Form<\u002Fstrong> — last 5 results (oldest → newest)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:rgba(20,23,28,0.45);margin-top:12px;line-height:1.6\">Click any column header to sort. Cards and corners come only from matches with synced detailed stats, so those columns fill in as you sync more matches.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStatsSegPlayers }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-if value=\"{{ playersNotAvailable }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:50px 20px;text-align:center\">\n            <div style=\"font-size:14px;font-weight:700;color:#14171C\">Player statistics: Premier League 2026\u002F27 only<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.5);margin-top:8px;line-height:1.6;max-width:460px;margin-left:auto;margin-right:auto\">The free player-data source (official Fantasy Premier League API) covers only the current PL season. No free source found for Championship or historical player data.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ playersAvailable }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px\">\n          <sc-for list=\"{{ playerBoards }}\" as=\"board\" hint-placeholder-count=\"3\">\n            <div style=\"background:#FFFFFF;border-radius:14px;border:1px solid rgba(0,0,0,0.07);padding:18px\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n                <div style=\"font-size:14.5px;font-weight:800;color:#14171C\">{{ board.title }}<\u002Fdiv>\n                <div style=\"font-size:11px;font-weight:700;color:rgba(20,23,28,0.45);text-transform:uppercase\">{{ board.unit }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ board.hasRows }}\" hint-placeholder-val=\"{{ false }}\">\n                <sc-for list=\"{{ board.rows }}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,0.05)\">\n                    <div style=\"width:20px;font-size:12px;font-weight:700;color:rgba(20,23,28,0.4);text-align:right\">{{ p.rank }}<\u002Fdiv>\n                    <sc-if value=\"{{ p.teamHasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ p.teamLogo }}\" style=\"width:22px;height:22px;flex-shrink:0;object-fit:contain\" \u002F><\u002Fsc-if><sc-if value=\"{{ p.teamN as=\"m\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ m.open }}\" style=\"padding:{{ matchCardPad }};border-radius:14px;background:{{ m.rowBg2 }};border:1px solid rgba(0,0,0,0.07);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.03)\">\n                <div style=\"display:flex;align-items:center;gap:12px\">\n                  <div style=\"flex:1;min-width:0;display:flex;align-items:center;gap:9px\">\n                    <sc-if value=\"{{ m.homeHasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ m.homeLogo }}\" style=\"width:30px;height:30px;flex-shrink:0;object-fit:contain\" \u002F><\u002Fsc-if><sc-if value=\"{{ m.homeNoLogo }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:30px;height:30px;border-radius:50%;flex-shrink:0;background:{{ m.homeColor }};color:{{ m.homeText }};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800\">{{ m.homeCode }}<\u002Fdiv><\u002Fsc-if>\n                    <div style=\"font-size:14px;color:#14171C;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ m.homeName }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"width:54px;flex-shrink:0;text-align:center;font-size:13px;font-weight:800;color:{{ m.statusColor }}\">{{ m.statusLabel }}<\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;display:flex;align-items:center;gap:9px;justify-content:flex-end\">\n                    <div style=\"font-size:14px;color:#14171C;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ m.awayName }}<\u002Fdiv>\n                    <sc-if value=\"{{ m.awayHasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ m.awayLogo }}\" style=\"width:30px;height:30px;flex-shrink:0;object-fit:contain\" \u002F><\u002Fsc-if><sc-if value=\"{{ m.awayNoLogo }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:30px;height:30px;border-radius:50%;flex-shrink:0;background:{{ m.awayColor }};color:{{ m.awayText }};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800\">{{ m.awayCode }}<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showFavEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:80px 20px;text-align:center\">\n          <div style=\"font-size:16px;font-weight:700;color:#14171C\">No teams followed<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:rgba(20,23,28,0.5);margin-top:10px;line-height:1.6\">Click \"Edit teams\" above to follow a club and see their matches here.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isFplTab }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:18px\">\n        <div>\n          <div style=\"font-size:22px;font-weight:800;color:#14171C\">FPL<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:rgba(20,23,28,0.5);margin-top:6px\">Fantasy Premier League player stats — price, ownership, form, points and more, straight from the official FPL API. Premier League 2026\u002F27 only. {{ fplSourceFetchedLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ fplNotAvailable }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:50px 20px;text-align:center\">\n          <div style=\"font-size:14px;font-weight:700;color:#14171C\">FPL data: Premier League 2026\u002F27 only<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:rgba(20,23,28,0.5);margin-top:8px;line-height:1.6;max-width:460px;margin-left:auto;margin-right:auto\">This tab always shows the current PL season — switch the league\u002Fseason selector back to Premier League 2026\u002F27 to see it. To see a player's <em>previous<\u002Fem> seasons, go there and click their row in the table; the season switcher doesn't apply to FPL data.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ fplNotSynced }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:50px 20px;text-align:center\">\n          <div style=\"font-size:14px;font-weight:700;color:#14171C\">No FPL data yet<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:rgba(20,23,28,0.5);margin-top:8px;line-height:1.6;max-width:460px;margin-left:auto;margin-right:auto\">Open the Stats tab and press Sync. If this is the first time, make sure the fpl-sync GitHub Action has run at least once (Actions tab → fpl-sync → Run workflow) so the data file exists.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ fplSynced }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px\">\n          <input value=\"{{ fplSearch }}\" sc-camel-on-input=\"{{ onFplSearch }}\" placeholder=\"Search player…\" style=\"padding:9px 14px;border-radius:10px;border:1px solid rgba(0,0,0,0.12);font-size:13px;min-width:200px;flex:1;max-width:280px\" \u002F>\n          <div style=\"display:flex;gap:6px;background:rgba(0,0,0,0.05);padding:5px;border-radius:12px\">\n            <sc-for list=\"{{ fplPosOptions }}\" as=\"po\" hint-placeholder-count=\"5\">\n              <div sc-camel-on-click=\"{{ po.click }}\" style=\"padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;background:{{ po.bg }};color:{{ po.color }}\">{{ po.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:rgba(20,23,28,0.45);margin-left:auto\">{{ fplResultsLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ fplHistOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-bottom:16px;padding:16px 18 28,0.35)\">{{ h.label }}{{ h.arrow }}<\u002Fsc-raw-th>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ fplRows }}\" as=\"p\" hint-placeholder-count=\"10\">\n                  <sc-raw-tr sc-camel-on-click=\"{{ p.toggleHistory }}\" style=\"border-bottom:1px solid rgba(0,0,0,0.06);background:{{ p.rowBg }};cursor:pointer\">\n                    <sc-raw-td style=\"padding:9px 5px\">\n                      <div style=\"display:flex;align-items:center;gap:8px\">\n                        <sc-if value=\"{{ p.teamHasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ p.teamLogo }}\" style=\"width:20px;height:20px;flex-shrink:0;object-fit:contain\" \u002F><\u002Fsc-if><sc-if value=\"{{ p.teamNoLogo }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:20px;height:20px;border-radius:50%;flex-shrink:0;background:{{ p.teamColor }};color:{{ p.teamText }};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800\">{{ p.teamCode }}<\u002Fdiv><\u002Fsc-if>\n                        <div>\n                          <div style=\"font-size:13px;color:#14171C;font-weight:600;white-space:nowrap\">{{ p.name }}<\u002Fdiv>\n                          <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);white-space:nowrap\">{{ p.teamName }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:12px;color:rgba(20,23,28,0.6);font-weight:700\">{{ p.pos }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:#14171C;font-weight:700\">{{ p.price }}<\u002Fsc-raw-td>\n                    <sc-if value=\"{{ !mobileMode }}\" hint-placeholder-val=\"{{ true }}\"><sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:12.5px;font-weight:600;color:{{ p.priceChangeColor }}\">{{ p.priceChange }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.owned }}<\u002Fsc-raw-td><\u002Fsc-if>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.form }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13.5px;color:#14171C;font-weight:800\">{{ p.totalPoints }}<\u002Fsc-raw-td>\n                    <sc-if value=\"{{ !mobileMode }}\" hint-placeholder-val=\"{{ true }}\"><sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.ppg }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.goals }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.assists }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.cleanSheets }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.bonus }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.bps }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.ict }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.xg }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padding:9px 5px;font-size:13px;color:rgba(20,23,28,0.7)\">{{ p.xa }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:center;padd tyle=\"font-size:14px;font-weight:700;color:rgba(20,23,28,0.35)\">vs<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;width:130px\">\n            <sc-if value=\"{{ selectedMatch.awayHasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ selectedMatch.awayLogo }}\" style=\"width:64px;height:64px;flex-shrink:0;object-fit:contain\" \u002F><\u002Fsc-if><sc-if value=\"{{ selectedMatch.awayNoLogo }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:64px;height:64px;border-radius:50%;background:{{ selectedMatch.awayColor }};color:{{ selectedMatch.awayText }};display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800\">{{ selectedMatch.awayCode }}<\u002Fdiv><\u002Fsc-if>\n            <div style=\"font-size:13.5px;font-weight:700;color:#14171C;text-align:center\">{{ selectedMatch.awayName }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;margin-top:20px\">\n          <div style=\"display:inline-block;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,0.05);font-size:12.5px;font-weight:800;color:{{ selectedMatch.statusColor }}\">{{ selectedMatch.statusPill }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;margin-top:14px\">\n          <div style=\"font-size:15px;font-weight:700;color:#14171C\">{{ selectedMatch.dateFull }}<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:rgba(20,23,28,0.55);margin-top:4px\">Kickoff {{ selectedMatch.timeLabel }} · {{ selectedMatch.venue }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ tableSynced }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">League table position<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\">\n              <div style=\"flex:1;background:rgba(13,148,136,0.06);border:1px solid rgba(13,148,136,0.18);border-radius:12px;padding:12px 14px\">\n                <div style=\"font-size:12px;font-weight:700;color:#14171C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ selectedMatch.homeName }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:6px\">\n                  <div style=\"font-size:22px;font-weight:800;color:#0D7A70\">{{ homeStand.rank }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:rgba(20,23,28,0.6)\">{{ homeStand.pts }} pts · {{ homeStand.played }} pl<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11.5px;color:rgba(20,23,28,0.55);margin-top:3px\">{{ homeStand.record }} · GD {{ homeStand.gd }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#0D7A70;font-weight:700;margin-top:3px\">{{ homeStand.venue }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;background:rgba(180,83,9,0.06);border:1px solid rgba(180,83,9,0.18);border-radius:12px;padding:12px 14px\">\n                <div style=\"font-size:12px;font-weight:700;color:#14171C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ selectedMatch.awayName }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:6px\">\n                  <div style=\"font-size:22px;font-weight:800;color:#92400E\">{{ awayStand.rank }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:rgba(20,23,28,0.6)\">{{ awayStand.pts }} pts · {{ awayStand.played }} pl<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11.5px;color:rgba(20,23,28,0.55);margin-top:3px\">{{ awayStand.record }} · GD {{ awayStand.gd }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#92400E;font-weight:700;margin-top:3px\">{{ awayStand.venue }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ analysisReady }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px;padding:16px;border-radius:14px;background:linear-gradient(180deg,rgba(13,148,136,0.05),rgba(0,0,0,0.02));border:1px solid rgba(0,0,0,0.08)\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px\">\n              <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em\">Win-lean analysis<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:800;color:#14171C\">{{ leanLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;height:26px;border-radius:8px;overflow:hidden;margin-top:12px;font-size:11px;font-weight:800\">\n              <div style=\"width:{{ homePStr }};background:{{ homePBarColor }};color:#FFFFFF;display:flex;align-items:center;justify-content:center;min-width:34px\">{{ homePStr }}<\u002Fdiv>\n              <div style=\"width:{{ drawPStr }};background:rgba(120,120,120,0.55);color:#FFFFFF;display:flex;align-items:center;justify-content:center;min-width:30px\">{{ drawPStr }}<\u002Fdiv>\n              <div style=\"width:{{ awayPStr }};background:{{ awayPBarColor }};color:#FFFFFF;display:flex;align-items:center;justify-content:center;min-width:34px\">{{ awayPStr }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:10.5px;color:rgba(20,23,28,0.5);margin-top:5px\">\n              <div>{{ selectedMatch.homeName }} win<\u002Fdiv><div>Draw<\u002Fdiv><div>{{ selectedMatch.awayName }} win<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasAnalysisFactors }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:14px\">\n                <div style=\"font-size:11px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;margin-bottom:8px\">Why<\u002Fdiv>\n                <sc-for list=\"{{ analysisFactors }}\" as=\"fa\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.05)\">\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:12.5px;font-weight:600;color:#14171C\">{{ fa.label }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:rgba(20,23,28,0.5)\">{{ fa.detail }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;background:{{ fa.chipBg }};color:{{ fa.chipColor }}\">{{ fa.who }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:12px;line-height:1.6\">A naive, transparent heuristic from form, table, goal difference and H2H — <strong>not<\u002Fstrong> a calibrated probability, not bookmaker odds, and not betting advice. It cannot see injuries, line-ups, motivation or market movement, which often decide matches. Use it as one input, not a signal.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ gm.ready }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px;padding:16px;border-radius:14px;background:rgba(13,148,136,0.04);border:1px solid rgba(0,0,0,0.08)\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Goals markets (from venue form)<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\">\n              <div style=\"flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.7);text-align:center\">\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.5);text-transform:uppercase;font-weight:700\">Over 2.5<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:800;color:#0D7A70;margin-top:2px\">{{ gm.leanO25 }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.6);margin-top:2px\">{{ gm.o25Verdict }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:4px\">{{ selectedMatch.homeCode }} home {{ gm.homeO25 }} · {{ selectedMatch.awayCode }} away {{ gm.awayO25 }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.7);text-align:center\">\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.5);text-transform:uppercase;font-weight:700\">BTTS<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:800;color:#0D7A70;margin-top:2px\">{{ gm.leanBtts }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.6);margin-top:2px\">{{ gm.bttsVerdict }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:4px\">{{ selectedMatch.homeCode }} home {{ gm.homeBtts }} · {{ selectedMatch.awayCode }} away {{ gm.awayBtts }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.7);text-align:center\">\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.5);text-transform:uppercase;font-weight:700\">Avg goals<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:800;color:#14171C;margin-top:2px\">{{ gm.avgG }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.6);margin-top:2px\">expected total<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:10px;line-height:1.6\">Home side's home matches and away side's away matches only — descriptive tendencies, not a probability or betting advice.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ gm.ccReady }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;padding:16px;border-radius:14px;background:rgba(180,83,9,0.04);border:1px solid rgba(0,0,0,0.08)\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Corners &amp; cards markets<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\">\n              <div style=\"flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.7);text-align:center\">\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.5);text-transform:uppercase;font-weight:700\">Corners<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:800;color:#0D7A70;margin-top:2px\">{{ gm.expCorners }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.6);margin-top:2px\">expected · O9.5 {{ gm.corLean }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.55);margin-top:2px\">{{ gm.corVerdict }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.7);text-align:center\">\n                <div style=\"font-size:10.5px;color:rgba(20,23,28,0.5);text-transform:uppercase;font-weight:700\">Cards<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:800;color:#B45309;margin-top:2px\">{{ gm.expCards }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.6);margin-top:2px\">expected · O4.5 {{ gm.crdLean }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(20,23,28,0.55);margin-top:2px\">{{ gm.crdVerdict }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:10px;line-height:1.6\">Based only on matches with synced detailed stats, so the sample can be small — sync more matches for firmer numbers. Descriptive, not betting advice.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasStatRows }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Match statistics<\u002Fdiv>\n            <sc-for list=\"{{ statRows }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"margin-bottom:10px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:#14171C\">\n                  <div style=\"width:40px\">{{ s.home }}<\u002Fdiv>\n                  <div style=\"color:rgba(20,23,28,0.5);font-weight:600\">{{ s.label }}<\u002Fdiv>\n                  <div style=\"width:40px;text-align:right\">{{ s.away }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:4px;margin-top:4px\">\n                  <div style=\"flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,0.06);position:relative;overflow:hidden;display:flex;justify-content:flex-end\"><div style=\"width:{{ s.homePct }}%;height:5px;border-radius:3px;background:{{ selectedMatch.homeColor }}\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,0.06);position:relative;overflow:hidden\"><div style=\"width:{{ s.awayPct }}%;height:5px;border-radius:3px;background:{{ selectedMatch.awayColor }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ statsPending }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px;font-size:12.5px;color:rgba(20,23,28,0.45)\">Loading match statistics…<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ statsFailed }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px;font-size:12.5px;color:#B91C1C;line-height:1.5\">Could not load match statistics: {{ sumError }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasGoals }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Goals &amp; assists<\u002Fdiv>\n            <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n              <sc-if value=\"{{ goalsInfo.homeHasScorers }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex:1;min-width:200px\">\n                  <div style=\"font-size:11.5px;font-weight:800;color:#14171C;margin-bottom:6px\">{{ selectedMatch.homeName }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#14171C;line-height:1.6\">{{ goalsInfo.homeScorers }}<\u002Fdiv>\n                  <sc-if value=\"{{ goalsInfo.homeHasAssists }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:11.5px;color:rgba(20,23,28,0.55);margin-top:3px\">Assist: {{ goalsInfo.homeAssists }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ goalsInfo.awayHasScorers }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex:1;min-width:200px\">\n                  <div style=\"font-size:11.5px;font-weight:800;color:#14171C;margin-bottom:6px\">{{ selectedMatch.awayName }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#14171C;line-height:1.6\">{{ goalsInfo.awayScorers }}<\u002Fdiv>\n                  <sc-if value=\"{{ goalsInfo.awayHasAssists }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:11.5px;color:rgba(20,23,28,0.55);margin-top:3px\">Assist: {{ goalsInfo.awayAssists }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"font-size:10.5px;color:rgba(20,23,28,0.45);margin-top:10px;line-height:1.6\">Totals for the whole match from the synced stats feed — exact goal minute is not available from this data source yet.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasForm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px\">\n            <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Form — last 5 (oldest first)<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n              <div style=\"width:36px;font-size:11px;font-weight:800;color:rgba(20,23,28,0.55)\">{{ selectedMatch.homeCode }}<\u002Fdiv>\n              <div style=\"display:flex;gap:5px\">\n                <sc-for list=\"{{ homeFormChips }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div style=\"width:22px;height:22px;border-radius:6px;background:{{ f.bg }};color:#FFFFFF;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center\">{{ f.letter }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <div style=\"width:36px;font-size:11px;font-weight:800;color:rgba(20,23,28,0.55)\">{{ selectedMatch.awayCode }}<\u002Fdiv>\n              <div style=\"display:flex;gap:5px\">\n                <sc-for list=\"{{ awayFormChips }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div style=\"width:22px;height:22px;border-radius:6px;background:{{ f.bg }};color:#FFFFFF;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center\">{{ f.letter }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:24px\">\n          <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Head to head<\u002Fdiv>\n          <div style=\"font-size:11px;color:rgba(20,23,28,0.4);margin-bottom:10px\">{{ h2hNote }}Season meetings show \"MW n\" until played.<\u002Fdiv>\n          <sc-if value=\"{{ h2hNoKey }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.45);line-height:1.6\">Run a sync in the Stats tab first — data will appear here afterwards.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ h2hEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.45)\">No previous meetings found in the API.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ h2hHasRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-for list=\"{{ h2hRows }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.05)\">\n                <div style=\"width:96px;flex-shrink:0;font-size:11.5px;color:rgba(20,23,28,0.5)\">{{ h.dateLabel }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0;font-size:12.5px;font-weight:600;color:#14171C;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ h.homeName }}<\u002Fdiv>\n                <div style=\"width:44px;flex-shrink:0;text-align:center;font-size:13px;font-weight:800;color:#14171C\">{{ h.score }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0;font-size:12.5px;font-weight:600;color:#14171C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ h.awayName }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:24px\">\n          <div style=\"font-size:12px;font-weight:800;color:rgba(20,23,28,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Unavailable \u002F doubtful players<\u002Fdiv>\n          <div style=\"font-size:11px;color:rgba(20,23,28,0.4);margin-bottom:10px\">Current squad status via the official Fantasy Premier League feed — reflects status now, not at the time of past matches.<\u002Fdiv>\n          <sc-if value=\"{{ injNoKey }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.45);line-height:1.6\">Run a sync in the Stats tab first — data will appear here afterwards.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ injNotAvailable }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.45);line-height:1.6\">Availability data exists only for Premier League 2026\u002F27 (via the FPL feed) — not for this league\u002Fseason.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ injNone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:rgba(20,23,28,0.45)\">No flagged absences for either squad in the FPL feed right now.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ injDone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n              <sc-if value=\"{{ injHomeHas }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex:1;min-width:200px\">\n                  <div style=\"font-size:11.5px;font-weight:800;color:#14171C;margin-bottom:6px\">{{ selectedMatch.homeName }}<\u002Fdiv>\n                  <sc-for list=\"{{ injHome }}\" as=\"p\" hint-placeholder-count=\"2\">\n                    <div style=\"padding:5px 0;border-bottom:1px solid rgba(0,0,0,0.05)\">\n pis\u002Fsite\u002Fv2\u002Fsports\u002Fsoccer\u002F' + lg + '\u002Fsummary';\nconst ofUrl = (folder, ofCode) => 'https:\u002F\u002Fraw.githubusercontent.com\u002Fopenfootball\u002Ffootball.json\u002Fmaster\u002F' + folder + '\u002F' + ofCode + '.json';\nconst FPL_URL = 'https:\u002F\u002Ffantasy.premierleague.com\u002Fapi\u002Fbootstrap-static\u002F';\nconst FPL_PROXIES = [\n  \u002F\u002F codetabs first: its ~5MB relay cap comfortably covers the ~1.5-2MB FPL bootstrap-static\n  \u002F\u002F payload, whereas corsproxy.io's free tier caps at ~1MB and 413s on it. thingproxy is an\n  \u002F\u002F extra fallback for redundancy since free relays are individually flaky\u002Funreliable.\n  (u) => 'https:\u002F\u002Fapi.codetabs.com\u002Fv1\u002Fproxy?quest=' + encodeURIComponent(u),\n  (u) => 'https:\u002F\u002Fapi.allorigins.win\u002Fraw?url=' + encodeURIComponent(u),\n  (u) => 'https:\u002F\u002Fthingproxy.freeboard.io\u002Ffetch\u002F' + u,\n  (u) => 'https:\u002F\u002Fcorsproxy.io\u002F?url=' + encodeURIComponent(u),\n];\nconst SUMMARY_CAP = 600;   \u002F\u002F effectively \"all matches\" in a season; ESPN throttling is the real ceiling\nconst LS_KEY = 'plapp_store_v3';\n\n\u002F\u002F ---- TheSportsDB (free key 123, browser\u002FCORS-friendly) — used only for leagues ESPN lacks ----\nconst TSDB_BASE = 'https:\u002F\u002Fwww.thesportsdb.com\u002Fapi\u002Fv1\u002Fjson\u002F123';\nconst API_DONE = { FT: 1, AET: 1, PEN: 1, 'Match Finished': 1 };\nconst API_LIVE = { '1H': 1, HT: 1, '2H': 1, ET: 1, BT: 1, P: 1, INT: 1, LIVE: 1 };\n\u002F\u002F keyword sets to pick the correct top-flight when resolving a TheSportsDB league by country\nconst TSDB_LEAGUE_HINT = {\n  'fin.1': ['veikkausliiga'],\n  'isl.1': ['urvalsdeild', '\\u00farvalsdeild', 'besta deild', 'pepsideild', 'premier'],\n};\n\u002F\u002F Known TheSportsDB league IDs — bypasses their search endpoint (restricted on the free key).\nconst TSDB_LEAGUE_ID = {\n  'fin.1': '4636', \u002F\u002F Finnish Veikkausliiga\n  'isl.1': '4642', \u002F\u002F Icelandic Úrvalsdeild karla \u002F Besta deild\n};\n\n\u002F\u002F ---- Small helpers ---------------------------------------------------------------\n\nfunction lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }\nfunction lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }\nfunction delay(ms) { return new Promise((res) => setTimeout(res, ms)); }\nfunction num(v) { const n = Number(String(v == null ? '' : v).replace('%', '')); return isFinite(n) ? n : 0; }\n\nfunction normName(name) {\n  return String(name || '').toLowerCase()\n    .replace(\u002F\\bafc\\b|\\bfc\\b\u002Fg, '').replace(\u002F&\u002Fg, 'and')\n    .replace(\u002F[^a-z0-9 ]\u002Fg, '').replace(\u002F\\s+\u002Fg, ' ').trim();\n}\n\nconst PL_ALIASES = {\n  ARS: ['arsenal'], AVL: ['aston villa'], BOU: ['bournemouth'], BRE: ['brentford'],\n  BHA: ['brighton'], CHE: ['chelsea'], COV: ['coventry'], CRY: ['crystal palace'],\n  EVE: ['everton'], FUL: ['fulham'], HUL: ['hull'], IPS: ['ipswich'],\n  LEE: ['leeds'], LIV: ['liverpool'],\n  MCI: ['manchester city', 'man city'], MUN: ['manchester united', 'man utd', 'man united'],\n  NEW: ['newcastle'], NFO: ['nottingham', 'nottm'], TOT: ['tottenham', 'spurs'],\n  SUN: ['sunderland'],\n};\n\nfunction hashColor(s) {\n  let h = 0;\n  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;\n  const hue = h % 360;\n  return 'hsl(' + hue + ',55%,38%)';\n}\n\nfunction emptyBucket() {\n  return { fixtures: {}, teams: {}, standings: null, standingsComputed: false, summaries: {}, discrepancies: [], sources: {}, lastSync: null };\n}\n\nfunction loadStore() {\n  const raw = lsGet(LS_KEY);\n  let s = { buckets: {} };\n  if (raw) { try { s = JSON.parse(raw); if (!s.buckets) s.buckets = {}; } catch (e) {} }\n  if (!s.fpl) s.fpl = null;\n  return s;\n}\n\nconst FPL_STATUS = { d: 'Doubtful', i: 'Injured', s: 'Suspended', u: 'Unavailable', n: 'Unavailable' };\n\nfunction espnStat(stats, names) {\n  if (!stats) return null;\n  for (const s of stats) {\n    const n = String(s.name || '').toLowerCase();\n    const l = String(s.label || s.displayName || '').toLowerCase();\n    for (const cand of names) { if (n === cand || l.indexOf(cand) !== -1) return s.displayValue != null ? s.displayValue : s.value; }\n  }\n  return null;\n}\n\n\u002F\u002F ---- Component ------------------------------------------------------------------\n\nclass Component extends DCLogic {\n  state = {\n    loaded: true,\n    mobileMode: (function () { try { return localStorage.getItem('tefa_mobile_mode') === 'true'; } catch (e) { return false; } })(),\n    tab: 'fixtures',\n    segment: 'fixtures',\n    statsSeg: 'teams',\n    league: 'eng.1',\n    leagueTier: 1,\n    seasonKey: '2026-27',\n    periodIdx: null,\n    selectedMatchUid: null,\n    followed: ['LIV', 'LEE', 'MUN'],\n    editingFavorites: false,\n    now: new Date(),\n    store: loadStore(),\n    sync: { running: false, phase: '', error: '' },\n    sortKey: 'pts',\n    sortDir: -1,\n    fplSortKey: 'totalPoints',\n    fplSortDir: -1,\n    fplPosFilter: 'all',\n    fplSearch: '',\n    fplExpanded: null,\n    fplHistory: {},\n    detail: { sumState: 'idle', sumError: '' },\n  };\n\n  _preSummaries = {};\n\n  componentDidMount() {\n    this.seedBuiltin();\n    this._timer = setInterval(() => this.setState({ now: new Date() }), 60000);\n  }\n  componentWillUnmount() { clearInterval(this._timer); }\n\n  bucketId(league, seasonKey) { return (league || this.state.league) + '|' + (seasonKey || this.state.seasonKey); }\n  bucket(league, seasonKey) { return this.state.store.buckets[this.bucketId(league, seasonKey)] || emptyBucket(); }\n  seasonCfg(key) { return SEASONS.find((s) => s.key === (key || this.state.seasonKey)) || SEASONS[0]; }\n\n  \u002F\u002F League-aware season resolution. Calendar-year leagues (Nordic\u002FIrish summer football) are played\n  \u002F\u002F April–November within a single year, so \"2026-27\" maps to the 2026 calendar season, etc.\n  resolveSeason(league, seasonKey) {\n    const s = this.seasonCfg(seasonKey);\n    const lc = leagueCfg(league || this.state.league);\n    if (lc.calendar) {\n      const yr = s.start; \u002F\u002F 2026, 2025, 2024\n      return {\n        key: s.key, label: String(yr), espnSeason: yr,\n        dates: yr + '0301-' + yr + '1215',\n        of: null, calendar: true,\n      };\n    }\n    return { key: s.key, label: s.label, espnSeason: s.start, dates: s.dates, of: s.of, calendar: false };\n  }\n\n  saveBucket(bid, patch) {\n    this.setState((s) => {\n      const buckets = Object.assign({}, s.store.buckets);\n      buckets[bid] = Object.assign({}, buckets[bid] || emptyBucket(), patch);\n      const store = Object.assign({}, s.store, { buckets });\n      lsSet(LS_KEY, JSON.stringify(store));\n      return { store };\n    });\n  }\n  saveStoreTop(patch) {\n    this.setState((s) => {\n      const store = Object.assign({}, s.store, patch);\n      lsSet(LS_KEY, JSON.stringify(store));\n      return { store };\n    });\n  }\n\n  seedBuiltin() {\n    const bid = 'eng.1|2026-27';\n    const b = this.state.store.buckets[bid];\n    if (b && Object.keys(b.fixtures || {}).length) return;\n    const fixtures = {};\n    PL_RAW.trim().split('\\n').forEach((line) => {\n      const [round, date, venue, home, away] = line.split('|');\n      const uid = home + '|' + away;\n      fixtures[uid] = { uid, round: Number(round), date, venue, home, away, state: 'pre', gh: null, ga: null, espnId: null, src: 'builtin', ofFt: null };\n    });\n    const teams = {};\n    Object.keys(PL_TEAMS).forEach((c) => { teams[c] = { name: PL_TEAMS[c].name, color: PL_TEAMS[c].color }; });\n    this.saveBucket(bid, { fixtures, teams });\n  }\n\n  \u002F\u002F ---- Team registry ------------------------------------------------------------\n\n  findCodeByName(teams, name) {\n    const n = normName(name);\n    if (!n) return null;\n    const codes = Object.keys(teams);\n    for (const c of codes) { if (normName(teams[c].name) === n) return c; }\n    for (const c of codes) {\n      const tn = normName(teams[c].name);\n      if (tn && (n.indexOf(tn) !== -1 || tn.indexOf(n) !== -1)) return c;\n    }\n    for (const c of Object.keys(PL_ALIASES)) {\n      if (teams[c]) { for (const a of PL_ALIASES[c]) { if (n.indexOf(a) !== -1) return c; } }\n    }\n    return null;\n  }\n\n  espnLogoThumb(url) {\n    if (!url) return null;\n    \u002F\u002F Rewrite ESPN's 500px logo to a small, low-quality combiner thumbnail to keep the app light.\n    const m = \u002Fa\\.espncdn\\.com(\\\u002Fi\\\u002Fteamlogos\\\u002F.+?\\.png)\u002F.exec(url);\n    if (m) return 'https:\u002F\u002Fa.espncdn.com\u002Fcombiner\u002Fi?img=' + m[1] + '&h=48&w=48&scale=crop&cquality=40';\n    return url;\n  }\n\n  registerTeam(teams, name, abbrev, color, logo) {\n    const thumb = this.espnLogoThumb(logo);\n    let code = this.findCodeByName(teams, name);\n    if (code) {\n      const patch = {};\n      if (color && !teams[code].colorFromApi) { patch.color = color; patch.colorFromApi = true; }\n      if (thumb && !teams[code].logo) patch.logo = thumb;\n      if (Object.keys(patch).length) teams[code] = Object.assign({}, teams[code], patch);\n      return code;\n    }\n    let base = String(abbrev || '').toUpperCase().replace(\u002F[^A-Z]\u002Fg, '') || normName(name).replace(\u002F \u002Fg, '').slice(0, 3).toUpperCase() || 'XXX';\n    code = base; let i = 2;\n    while (teams[code]) { code = base + i; i++; }\n    teams[code] = { name: name, color: color || hashColor(name), colorFromApi: !!color, logo: thumb || null };\n    return code;\n  }\n\n  \u002F\u002F ---- Sync ------------------------------------------------------------------------\n\n  async fetchJson(url) {\n    const res = await fetch(url);\n    if (!res.ok) throw new Error('HTTP ' + res.status + ' from ' + url.split('\u002F')[2]);\n    return res.json();\n  }\n\n  \u002F\u002F Fetch that tries direct first, then public CORS relays (for hosts that may block browsers).\n  async fetchJsonCors(url) {\n    try { return await this.fetchJson(url); } catch (e) { \u002F* fall through to relays *\u002F }\n    let lastErr = null;\n    for (const wrap of FPL_PROXIES) {\n      try { return await this.fetchJson(wrap(url)); } catch (e) { lastErr = e; }\n    }\n    throw new Error('Blocked direct and via relays (' + (lastErr && lastErr.message) + ').');\n  }\n\n  setPhase(phase) { this.setState((s) => ({ sync: Object.assign({}, s.sync, { phase }) })); }\n\n  \u002F\u002F ---- TheSportsDB sync (Finland \u002F Iceland only) ----------------------------------\n  async tsdbResolveLeagueId(league, country) {\n    \u002F\u002F Prefer a known hardcoded id (TheSportsDB's search endpoint is restricted on the free key).\n    if (TSDB_LEAGUE_ID[league]) {\n      const id = TSDB_LEAGUE_ID[league];\n      const names = Object.assign({}, this.state.store.tsdbLeagueNames || {});\n      if (!names[league]) { names[league] = leagueCfg(league).label; this.saveStoreTop({ tsdbLeagueNames: names }); }\n      return id;\n    }\n    const cached = (this.state.store.tsdbLeagueIds || {})[league];\n    if (cached) return cached;\n    const d = await this.fetchJsonCors(TSDB_BASE + '\u002Fsearch_all_leagues.php?c=' + encodeURIComponent(country) + '&s=Soccer');\n    const list = d.countrys || d.leagues || [];\n    if (!list.length) throw new Error('TheSportsDB lists no soccer leagues for ' + country);\n    const hints = TSDB_LEAGUE_HINT[league] || [];\n    const bad = ['women', 'kvenna', 'u19', 'u21', 'u23', 'youth', 'cup', 'bikar', 'reserve'];\n    const clean = list.filter((l) => { const n = String(l.strLeague || '').toLowerCase(); return !bad.some((x) => n.indexOf(x) !== -1); });\n    const pool = clean.length ? clean : list;\n    let pick = pool.find((l) => { const n = String(l.strLeague || '').toLowerCase(); return hints.some((h) => n.indexOf(h) !== -1); });\n    if (!pick) pick = pool[0];\n    const id = pick.idLeague;\n    const map = Object.assign({}, this.state.store.tsdbLeagueIds || {}); map[league] = id;\n    const names = Object.assign({}, this.state.store.tsdbLeagueNames || {}); names[league] = pick.strLeague || '';\n    this.saveStoreTop({ tsdbLeagueIds: map, tsdbLeagueNames: names });\n    return id;\n  }\n\n  async tsdbSyncLeague(league, seasonKey, scfg, bid) {\n    const lc = leagueCfg(league);\n    const tsdbId = await this.tsdbResolveLeagueId(league, lc.country);\n    const resolvedName = (this.state.store.tsdbLeagueNames || {})[league] || ('league #' + tsdbId);\n    let teams = {}; let fixtures = {}; const sources = {};\n\n    \u002F\u002F Recent results + upcoming fixtures FIRST — these endpoints are season-independent and\n    \u002F\u002F always return current data, so they're the reliable \"basic data\" backbone.\n    const ingest = (ev) => {\n      if (!ev) return;\n      const hc = this.registerTeam(teams, ev.strHomeTeam, null, null, ev.strHomeTeamBadge || null);\n      const ac = this.registerTeam(teams, ev.strAwayTeam, null, null, ev.strAwayTeamBadge || null);\n      const hs = ev.intHomeScore, as_ = ev.intAwayScore;\n      const done = hs != null && hs !== '' && as_ != null && as_ !== '';\n      const dt = ev.strTimestamp || (ev.dateEvent ? ev.dateEvent + 'T' + (ev.strTime || '00:00:00') : null);\n      if (!dt) return;\n      const uid = hc + '|' + ac + '|' + String(dt).slice(0, 10);\n      fixtures[uid] = {\n        uid, round: ev.intRound ? num(ev.intRound) : null, date: dt, venue: ev.strVenue || null,\n        home: hc, away: ac, state: done ? 'post' : 'pre',\n        gh: done ? num(hs) : null, ga: done ? num(as_) : null, espnId: null, src: 'tsdb',\n      };\n    };\n    \u002F\u002F The free-tier \"eventspastleague\"\u002F\"eventsnextleague\" endpoints cap out hard \\u2014 for a\n    \u002F\u002F smaller league like this they can return as little as a single event, nowhere near\n    \u002F\u002F enough to see the full team list or compute form (which needs real match history).\n    \u002F\u002F \"eventsround.php\" has no such cap per call, so page through every round of the season\n    \u002F\u002F instead. Slower (one request per round) but it's the only reliable way to get complete\n    \u002F\u002F coverage from this API tier, and it naturally picks up upcoming (unplayed) rounds too.\n    const curYear = new Date().getFullYear();\n    const roundSeason = scfg.espnSeason || curYear;\n    let total = 0, missesInARow = 0, round = 1;\n    while (round <= 40 && missesInARow < 3) {\n      try {\n        const r = await this.fetchJsonCors(TSDB_BASE + '\u002Feventsround.php?id=' + tsdbId + '&r=' + round + '&s=' + roundSeason);\n        const evs = r.events || [];\n        if (evs.length) { evs.forEach((e) => { ingest(e); total++; }); missesInARow = 0; }\n        else { missesInARow++; }\n      } catch (e) { missesInARow++; }\n      round++;\n      await delay(120);\n    }\n    sources.tsdbEvents = total ? { ok: true, ts: Date.now(), count: total } : { ok: false, ts: Date.now(), err: 'no events found via round-by-round fetch (free key may not cover this league\u002Fseason)' };\n\n    \u002F\u002F Standings: try the selected season, then the current year, then no season param.\n    \u002F\u002F Note: some leagues (e.g. Veikkausliiga) split into a championship\u002Fchallenger group\n    \u002F\u002F partway through the season, and this endpoint only ever returns ONE of those groups\n    \u002F\u002F (6 of 12 teams) \\u2014 never the full table. So this is only ever treated as a starting\n    \u002F\u002F point; below we compare it against the standings computed from the full round-by-round\n    \u002F\u002F fixture set above, and use whichever actually has more teams in it.\n    let standings = null;\n    const buildTable = (table) => table.map((r) => {\n      const code = this.registerTeam(teams, r.strTeam, null, null, r.strBadge || null);\n      return {\n        code, rank: num(r.intRank), pts: num(r.intPoints), gd: num(r.intGoalDifference),\n        played: num(r.intPlayed), win: num(r.intWin), draw: num(r.intDraw), lose: num(r.intLoss),\n        gf: num(r.intGoalsFor), ga: num(r.intGoalsAgainst),\n      };\n    });\n    const seasonTries = [scfg.espnSeason, curYear, curYear + '-' + curYear, (curYear - 1) + '-' + curYear].filter((v, i, a) => a.indexOf(v) === i);\n    let tableErr = '';\n    for (const s of seasonTries) {\n      try {\n        const st = await this.fetchJsonCors(TSDB_BASE + '\u002Flookuptable.php?l=' + tsdbId + '&s=' + s);\n        const table = st.table || [];\n        if (table.length) { standings = buildTable(table); break; }\n        tableErr = 'empty for season ' + s;\n      } catch (e) { tableErr = String(e.message || e); }\n    }\n    sources.tsdbTable = standings ? { ok: true, ts: Date.now() } : { ok: false, ts: Date.now(), err: tableErr || 'no table' };\n\n    if (!standings && !total) {\n      throw new Error('TheSportsDB gave no table and no events for ' + lc.label + ' (resolved to \\u201c' + resolvedName + '\\u201d). The free key likely doesn\\u2019t cover these methods for this league, or the season isn\\u2019t populated.');\n    }\n\n    const computedStandings = this.computeStandings(fixtures, teams);\n    let tableFromApi = !!standings;\n    if (!standings || computedStandings.length > standings.length) {\n      standings = computedStandings;\n      tableFromApi = false;\n    }\n    this.saveBucket(bid, { teams, fixtures, standings, standingsComputed: !tableFromApi, sources, lastSync: new Date().toISOString(), tsdbResolvedName: resolvedName });\n  }\n\n  matchFixtureByPair(fixtures, teams, homeCode, awayCode, dateStr, maxDays) {\n    let best = null, bestDiff = Infinity;\n    const d = new Date(dateStr);\n    Object.keys(fixtures).forEach((uid) => {\n      const f = fixtures[uid];\n      if (f.home !== homeCode || f.away !== awayCode) return;\n      const diff = Math.abs(new Date(f.date) - d);\n      if (diff < bestDiff) { bestDiff = diff; best = f; }\n    });\n    return best && bestDiff <= maxDays * 86400000 ? best : null;\n  }\n\n  syncLeagueData = async (league, seasonKey, opts) => {\n    opts = opts || {};\n    const skipSummaries = !!opts.skipSummaries;\n    const phasePrefix = opts.phasePrefix || '';\n    const bid = this.bucketId(league, seasonKey);\n    const scfg = this.resolveSeason(league, seasonKey);\n\n    \u002F\u002F Leagues ESPN doesn't serve are synced via TheSportsDB instead.\n    if (leagueCfg(league).source === 'tsdb') {\n      this.setPhase(phasePrefix + 'TheSportsDB: fetching ' + leagueCfg(league).label + ' ' + scfg.label + '…');\n      try { await this.tsdbSyncLeague(league, seasonKey, scfg, bid); return []; }\n      catch (e) { return [String(e.message || e)]; }\n    }\n\n    const problems = [];\n    let b = Object.assign(emptyBucket(), this.bucket(league, seasonKey));\n    let fixtures = Object.assign({}, b.fixtures);\n    let teams = Object.assign({}, b.teams);\n    const sources = Object.assign({}, b.sources);\n\n    \u002F\u002F 1) ESPN scoreboard for the whole season\n    let usedPrevSeason = false;\n    try {\n      this.setPhase(phasePrefix + 'ESPN: results & scores (' + scfg.label + ')…');\n      let d = await this.fetchJson(espnScoreUrl(league) + '?limit=600&dates=' + scfg.dates);\n      let events = d.events || [];\n      if (!events.length) {\n        \u002F\u002F Fallback A: some leagues (smaller ones especially) haven't had next season's\n        \u002F\u002F fixtures published by ESPN yet. Try the previous season's full date range first —\n        \u002F\u002F it's complete, so it gives the full team roster instead of a handful of teams.\n        try {\n          const prevDates = scfg.dates.replace(\u002F(\\d{4})(\\d{4})\u002Fg, (m, y, md) => (Number(y) - 1) + md);\n          d = await this.fetchJson(espnScoreUrl(league) + '?limit=600&dates=' + prevDates);\n          events = d.events || [];\n          if (events.length) usedPrevSeason = true;\n        } catch (e1) {}\n      }\n      if (!events.length) {\n        \u002F\u002F Fallback B: retry with the season param, then with no date filter (ESPN's current\n        \u002F\u002F default slate) as a last resort — these often return only a handful of matches.\n        try {\n          d = await this.fetchJson(espnScoreUrl(league) + '?limit=600&season=' + scfg.espnSeason);\n          events = d.events || [];\n        } catch (e2) {}\n        if (!events.length) {\n          try { d = await this.fetchJson(espnScoreUrl(league) + '?limit=600'); events = d.events || []; } catch (e3) {}\n        }\n      }\n      if (!events.length) throw new Error('ESPN returned no matches for ' + league + ' ' + scfg.label + ' (this league\u002Fseason may not be in ESPN\\u2019s data)');\n      if (usedPrevSeason) problems.push(leagueCfg(league).label + ' ' + scfg.label + ' isn\\u2019t published by ESPN yet \\u2014 showing the most recent completed season\\u2019s teams and results instead.');\n      let matched = 0;\n      events.forEach((ev) => {\n        const comp = (ev.competitions || [])[0];\n        if (!comp) return;\n        let hc = null, ac = null, gh = null, ga = null, hEspnId = null, aEspnId = null, hShoot = null, aShoot = null;\n        (comp.competitors || []).forEach((c) => {\n          const t = c.team || {};\n          const code = this.registerTeam(teams, t.displayName || t.name || t.shortDisplayName || '?', t.abbreviation, t.color ? '#' + String(t.color).replace('#', '') : null, t.logo || (t.logos && t.logos[0] && t.logos[0].href) || null);\n          const shoot = c.shootoutScore != null ? num(c.shootoutScore) : null;\n          if (c.homeAway === 'home') { hc = code; gh = c.score != null ? num(c.score) : null; hEspnId = t.id; hShoot = shoot; }\n          else { ac = code; ga = c.score != null ? num(c.score) : null; aEspnId = t.id; aShoot = shoot; }\n        });\n        if (!hc || !ac) return;\n        matched++;\n        const stateStr = ev.status &&
